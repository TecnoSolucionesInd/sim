<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración · SIM</title>
<link rel="stylesheet" href="../core/sim.css">
<style>
  .pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
  .pagehead h1{font-size:38px}
  .tbl-wrap{overflow-x:auto}
  .u-cell{display:flex;align-items:center;gap:12px}
  .u-ini{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
  .rowbtn{cursor:pointer}
  .perm-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  .perm-app{display:flex;align-items:center;gap:12px}
  .perm-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .mods{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 18px;padding:4px 0 2px 50px}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .appcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .appcard{padding:22px;border-radius:20px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);animation:rise .7s var(--ease) both}
  .stitle{font-family:var(--f-display);font-weight:600;font-size:17px;margin:26px 0 6px}
  @media (max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)}.perm-row{grid-template-columns:minmax(0,1fr)}.mods{padding-left:0}.pagehead h1{font-size:30px}}
</style>
</head>
<body>
<script type="module">
import { iniciarApp, toast, db, auth } from '../core/core.js';
import { firebaseConfig, ADMIN_EMAIL } from '../core/config.js';
import { APPS, ROLES, ESTADOS } from '../core/catalogo.js';
import { iniciales } from '../core/sesion.js';
import { collection, getDocs, doc, setDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { initializeApp, deleteApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const APPS_ASIG = APPS.filter(a => !a.soloAdmin);
const ROL_COLOR = { admin: ['rgba(111,227,207,.16)', '#8FF0DE'], supervisor: ['rgba(245,185,74,.16)', '#FFCF73'], operador: ['rgba(169,180,255,.16)', '#C5CCFF'], lectura: ['rgba(255,255,255,.09)', '#DDE4EB'] };
const rolPill = (r) => r ? `<span class="pill" style="background:${ROL_COLOR[r][0]};color:${ROL_COLOR[r][1]}">${ROLES.find(x => x.id === r).label}</span>` : '<span style="color:#8B97A3">—</span>';
const esAdminSist = (u) => (u.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase();

let usuarios = [];
let ctxRef = null;

async function cargarUsuarios() {
  const snap = await getDocs(collection(db, 'usuarios'));
  usuarios = snap.docs.map(d => ({ uid: d.id, ...d.data() })).sort((a, b) => (a.nombre || a.email).localeCompare(b.nombre || b.email));
}

// ---------------- módulo Usuarios ----------------
function vistaUsuarios(main) {
  main.innerHTML = `
    <div class="pagehead">
      <div><div class="eyebrow rise">Administración</div><h1 class="h-display rise d1" style="margin-top:12px">Usuarios</h1></div>
      <button class="btn btn-primary rise d2" id="bNuevo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nuevo usuario</button>
    </div>
    <div class="glass rise d2 tbl-wrap">
      <table class="table" style="min-width:720px">
        <thead><tr><th>Usuario</th><th>Área</th><th>Aplicativos</th><th>Estado</th><th></th></tr></thead>
        <tbody id="tbU"><tr><td colspan="5"><div class="skel" style="height:22px"></div></td></tr></tbody>
      </table>
    </div>`;
  main.querySelector('#bNuevo').onclick = () => abrirModal(null);
  pintarUsuarios(main);
}

function pintarUsuarios(main) {
  const tb = main.querySelector('#tbU');
  if (!tb) return;
  if (!usuarios.length) { tb.innerHTML = '<tr><td colspan="5" class="muted" style="padding:28px 20px">Aún no hay usuarios registrados.</td></tr>'; return; }
  tb.innerHTML = usuarios.map((u, i) => {
    const nApps = esAdminSist(u) ? 'Todos' : Object.values(u.apps || {}).filter(p => p && p.rol).length;
    const est = u.activo ? '<span class="pill" style="background:rgba(111,227,207,.16);color:#8FF0DE">Activo</span>' : '<span class="pill" style="background:rgba(255,143,143,.14);color:#FFB3B3">Inactivo</span>';
    return `<tr class="rowbtn slide" data-uid="${u.uid}" style="animation-delay:${(0.05 * i).toFixed(2)}s">
      <td><div class="u-cell"><div class="u-ini">${esc(iniciales(u.nombre, u.email))}</div><div><div style="font-weight:500">${esc(u.nombre || '—')}${esAdminSist(u) ? ' <span class="pill" style="background:rgba(169,180,255,.16);color:#C5CCFF;margin-left:6px">Administrador</span>' : ''}</div><div style="font-size:12.5px;color:var(--tx-3)">${esc(u.email)}</div></div></div></td>
      <td>${esc(u.area || '—')}</td>
      <td class="mono">${nApps}</td>
      <td>${est}</td>
      <td style="text-align:right"><button class="btn" style="height:38px" data-edit="${u.uid}">Editar</button></td>
    </tr>`;
  }).join('');
  tb.querySelectorAll('[data-uid]').forEach(r => r.onclick = () => abrirModal(usuarios.find(u => u.uid === r.dataset.uid)));
}

// ---------------- módulo Permisos (matriz) ----------------
function vistaPermisos(main) {
  main.innerHTML = `
    <div class="pagehead">
      <div><div class="eyebrow rise">Administración</div><h1 class="h-display rise d1" style="margin-top:12px">Permisos por aplicativo</h1></div>
    </div>
    <div class="glass rise d2 tbl-wrap">
      <table class="table" style="min-width:${300 + APPS_ASIG.length * 130}px">
        <thead><tr><th>Usuario</th>${APPS_ASIG.map(a => `<th>${esc(a.nombre)}</th>`).join('')}</tr></thead>
        <tbody>${usuarios.filter(u => !esAdminSist(u)).map((u, i) => `
          <tr class="rowbtn slide" data-uid="${u.uid}" style="animation-delay:${(0.05 * i).toFixed(2)}s;${u.activo ? '' : 'opacity:.5'}">
            <td><div class="u-cell"><div class="u-ini">${esc(iniciales(u.nombre, u.email))}</div><div><div style="font-weight:500">${esc(u.nombre || '—')}</div><div style="font-size:12px;color:var(--tx-3)">${esc(u.area || '')}</div></div></div></td>
            ${APPS_ASIG.map(a => `<td>${rolPill((u.apps || {})[a.id]?.rol)}</td>`).join('')}
          </tr>`).join('') || `<tr><td colspan="${APPS_ASIG.length + 1}" class="muted" style="padding:28px 20px">Aún no hay usuarios con permisos asignados.</td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="rise d3" style="margin-top:18px;display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:#BAC5D0">
      ${ROLES.map(r => `<span><b style="color:${ROL_COLOR[r.id][1]}">${r.label}</b> ${r.desc.toLowerCase()}</span>`).join('')}
    </div>`;
  main.querySelectorAll('[data-uid]').forEach(r => r.onclick = () => abrirModal(usuarios.find(u => u.uid === r.dataset.uid)));
}

// ---------------- módulo Aplicativos ----------------
function vistaAplicativos(main) {
  main.innerHTML = `
    <div class="pagehead">
      <div><div class="eyebrow rise">Administración</div><h1 class="h-display rise d1" style="margin-top:12px">Aplicativos</h1></div>
    </div>
    <div class="appcards">${APPS.map((a, i) => {
      const st = ESTADOS[a.estado];
      return `<div class="appcard" style="animation-delay:${(0.06 * i).toFixed(2)}s">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div class="perm-ico" style="width:48px;height:48px;border-radius:14px;background:${a.color}24;border:1px solid ${a.color}55"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${a.color}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${a.icon}"/></svg></div>
          <span class="mono" style="font-size:12px;color:var(--tx-3)">${a.fase}</span>
        </div>
        <div style="font-family:var(--f-display);font-weight:600;font-size:18px;margin-top:16px">${esc(a.nombre)}</div>
        <div style="font-size:13.5px;color:#BAC5D0;margin-top:4px">${esc(a.sub)}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
          <span class="pill" style="background:${st.bg};color:${st.fg}">${st.label}</span>
          <span class="pill" style="background:${a.url ? 'rgba(111,227,207,.12)' : 'rgba(255,255,255,.06)'};color:${a.url ? '#8FF0DE' : '#C3CDD8'}">${a.url ? 'Integrado' : 'Por integrar'}</span>
        </div>
        <div style="margin-top:14px;font-size:13px;color:var(--tx-2)">${a.modulos.length ? a.modulos.map(m => esc(m.nombre)).join(' · ') : 'Módulos por definir'}</div>
        ${(a.herramientas || []).map(h => `<a class="btn" href="../${h.url}" style="margin-top:14px;height:40px;font-size:13px">${esc(h.nombre)}</a>`).join('')}
      </div>`;
    }).join('')}</div>`;
}

// ---------------- modal de usuario ----------------
function genClave() {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  const a = new Uint32Array(14); crypto.getRandomValues(a);
  return Array.from(a, n => c[n % c.length]).join('');
}

function abrirModal(u) {
  const nuevo = !u;
  const adminSist = u && esAdminSist(u);
  const apps = (u && u.apps) || {};
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <form class="modal" novalidate>
      <div class="modal-h">
        <div style="font-family:var(--f-display);font-weight:600;font-size:21px">${nuevo ? 'Nuevo usuario' : 'Editar usuario'}</div>
        <button type="button" class="btn btn-icon" data-x aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="modal-b">
        <div class="grid2">
          <div><label class="label" for="mNom">Nombre completo</label><input class="field" id="mNom" value="${esc(u?.nombre || '')}" required></div>
          <div><label class="label" for="mArea">Área / cargo</label><input class="field" id="mArea" value="${esc(u?.area || '')}"></div>
          <div><label class="label" for="mMail">Correo</label><input class="field" id="mMail" type="email" value="${esc(u?.email || '')}" ${nuevo ? '' : 'disabled'} required></div>
          ${nuevo ? `<div><label class="label" for="mPass">Clave inicial (opcional)</label><input class="field" id="mPass" type="text" placeholder="Vacío = se envía enlace por correo" autocomplete="off"></div>`
                  : `<div style="display:flex;align-items:flex-end"><label class="check" style="height:48px"><input type="checkbox" id="mAct" ${u.activo ? 'checked' : ''} ${adminSist ? 'disabled' : ''}>Usuario activo</label></div>`}
        </div>
        ${adminSist ? '<div class="alert ok" style="margin-top:22px">El administrador del sistema tiene acceso total a todos los aplicativos.</div>' : `
        <div class="stitle">Permisos por aplicativo</div>
        <div style="font-size:13px;color:var(--tx-3)">Asigne un rol en cada aplicativo. Sin rol, el aplicativo no se muestra al usuario.</div>
        <div id="mPerms">${APPS_ASIG.map(a => {
          const p = apps[a.id] || {};
          const sel = Array.isArray(p.modulos) && p.modulos.length ? p.modulos : a.modulos.map(m => m.id);
          return `<div class="perm-row" data-app="${a.id}">
            <div class="perm-app">
              <div class="perm-ico" style="background:${a.color}24;border:1px solid ${a.color}55"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${a.color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${a.icon}"/></svg></div>
              <div><div style="font-weight:500;font-size:14.5px">${esc(a.nombre)}</div><div style="font-size:12px;color:var(--tx-3)">${a.url ? 'Integrado' : 'Por integrar'}</div></div>
            </div>
            <div><label class="sr" for="r_${a.id}">Rol en ${esc(a.nombre)}</label>
              <select class="field" id="r_${a.id}" style="height:44px;font-size:14px">
                <option value="">Sin acceso</option>
                ${ROLES.map(r => `<option value="${r.id}" ${p.rol === r.id ? 'selected' : ''}>${r.label}</option>`).join('')}
              </select>
            </div>
            ${a.modulos.length ? `<div class="mods" ${p.rol ? '' : 'hidden'}>${a.modulos.map(m => `<label class="check" style="font-size:13.5px"><input type="checkbox" value="${m.id}" ${sel.includes(m.id) ? 'checked' : ''}>${esc(m.nombre)}</label>`).join('')}</div>` : ''}
          </div>`;
        }).join('')}</div>`}
        <div class="alert err" id="mErr" style="margin-top:18px" hidden></div>
      </div>
      <div class="modal-f">
        ${!nuevo ? '<button type="button" class="btn" id="mReset" style="margin-right:auto">Enviar enlace para cambiar clave</button>' : ''}
        <button type="button" class="btn" data-x>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="mSave">${nuevo ? 'Crear usuario' : 'Guardar cambios'}</button>
      </div>
    </form>`;
  document.body.appendChild(bg);
  const $ = (s) => bg.querySelector(s);
  const cerrar = () => bg.remove();
  bg.querySelectorAll('[data-x]').forEach(b => b.onclick = cerrar);
  bg.addEventListener('mousedown', (e) => { if (e.target === bg) cerrar(); });
  bg.querySelectorAll('.perm-row select').forEach(s => s.onchange = () => {
    const mods = s.closest('.perm-row').querySelector('.mods');
    if (mods) mods.hidden = !s.value;
  });
  const err = (t) => { $('#mErr').hidden = !t; $('#mErr').textContent = t || ''; };

  if ($('#mReset')) $('#mReset').onclick = async () => {
    try { auth.languageCode = 'es'; await sendPasswordResetEmail(auth, u.email); toast(`Enlace enviado a ${u.email}`); }
    catch (e) { toast('No se pudo enviar: ' + (e.code || e.message), 'err'); }
  };

  const leerPermisos = () => {
    const out = {};
    bg.querySelectorAll('.perm-row').forEach(row => {
      const id = row.dataset.app, rol = row.querySelector('select').value;
      if (!rol) return;
      const app = APPS.find(a => a.id === id);
      const checks = [...row.querySelectorAll('.mods input:checked')].map(i => i.value);
      if (app.modulos.length && checks.length === 0) throw { msg: `Seleccione al menos un módulo en ${app.nombre} o quite su rol.` };
      // modulos vacío = todos los módulos (incluye los que se agreguen después)
      out[id] = { rol, modulos: checks.length === app.modulos.length ? [] : checks };
    });
    return out;
  };

  bg.querySelector('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    err('');
    const nombre = $('#mNom').value.trim(), area = $('#mArea').value.trim();
    if (!nombre) return err('Ingrese el nombre.');
    let permisos;
    try { permisos = adminSist ? (u.apps || {}) : leerPermisos(); } catch (e) { return err(e.msg); }
    const btn = $('#mSave'); btn.disabled = true; btn.textContent = 'Guardando…';
    try {
      if (nuevo) {
        const email = $('#mMail').value.trim().toLowerCase();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw { msg: 'Ingrese un correo válido.' };
        let clave = $('#mPass').value.trim();
        const enviarEnlace = !clave;
        if (enviarEnlace) clave = genClave();
        if (clave.length < 8) throw { msg: 'La clave inicial debe tener al menos 8 caracteres.' };
        // Se crea la cuenta en una instancia secundaria para no cerrar la sesión del administrador
        const sec = initializeApp(firebaseConfig, 'alta-' + Date.now());
        const secAuth = getAuth(sec);
        let uid;
        try {
          const cred = await createUserWithEmailAndPassword(secAuth, email, clave);
          uid = cred.user.uid;
          await signOut(secAuth);
        } finally { deleteApp(sec).catch(() => {}); }
        await setDoc(doc(db, 'usuarios', uid), { email, nombre, area, activo: true, apps: permisos, creado: serverTimestamp(), actualizado: serverTimestamp() });
        if (enviarEnlace) { auth.languageCode = 'es'; await sendPasswordResetEmail(auth, email); }
        toast(enviarEnlace ? `Usuario creado. Se envió a ${email} el enlace para crear su clave.` : 'Usuario creado.');
      } else {
        const datos = { nombre, area, actualizado: serverTimestamp() };
        if (!adminSist) { datos.apps = permisos; datos.activo = $('#mAct').checked; }
        await updateDoc(doc(db, 'usuarios', u.uid), datos);
        toast('Cambios guardados.');
      }
      cerrar();
      await refrescar();
    } catch (e) {
      const m = e.msg || ({ 'auth/email-already-in-use': 'Ese correo ya tiene una cuenta creada.', 'auth/invalid-email': 'El correo no es válido.', 'auth/weak-password': 'La clave es muy débil.', 'permission-denied': 'Sin permisos. Verifique las reglas de seguridad y que su correo esté verificado.' }[e.code]) || ('Error: ' + (e.code || e.message));
      err(m);
      btn.disabled = false; btn.textContent = nuevo ? 'Crear usuario' : 'Guardar cambios';
    }
  });
}

async function refrescar() {
  try { await cargarUsuarios(); } catch (e) { toast('No se pudo leer usuarios: ' + (e.code || e.message), 'err'); }
  if (ctxRef) render(ctxRef.modulo, ctxRef);
}

function render(mod, ctx) {
  if (mod === 'permisos') vistaPermisos(ctx.main);
  else if (mod === 'aplicativos') vistaAplicativos(ctx.main);
  else vistaUsuarios(ctx.main);
}

ctxRef = await iniciarApp({ appId: 'adm', alCambiarModulo: (mod, ctx) => render(mod, ctx) });
await refrescar();
</script>
</body>
</html>
