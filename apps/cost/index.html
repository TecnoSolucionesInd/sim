<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costos de mantenimiento · SIM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#CDD5DE; --card:#F3F5F7; --card2:#E8ECF0; --line:#BFC9D3; --ink:#1B2733; --ink2:#46535F; --muted:#6A7684;
  --nav:#1D2E40; --nav2:#26405A; --navink:#C9D4DF; --accent:#2BA6A0;
  --c-cong:#2a78d6; --c-cal:#eb6834; --c-hie:#1baf7a; --c-osm:#eda100; --c-res:#e87ba4; --c-sin:#8A96A3;
  --oco:#256abf; --osr:#86b6ef; --capex:#7a5bbf;
  --ok:#2f8f4e; --warn:#c98500; --bad:#cc3d3d;
  --r:10px; --sh:0 1px 2px rgba(20,32,46,.08),0 2px 8px rgba(20,32,46,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px}
body{display:flex;min-height:100vh}
.num{font-variant-numeric:tabular-nums}
/* sidebar */
#side{width:236px;flex:0 0 236px;background:var(--nav);color:var(--navink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand small{display:block;letter-spacing:.14em;text-transform:uppercase;font-size:10px;color:#8FA3B7}
.brand b{display:block;color:#fff;font-size:16px;margin-top:4px;line-height:1.25}
.brand span{display:block;font-size:11.5px;color:#9FB1C3;margin-top:3px}
nav{padding:10px 8px;overflow:auto;flex:1}
nav .grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7F93A8;padding:12px 10px 6px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--navink);text-decoration:none;cursor:pointer;font-size:13.5px}
nav a:hover{background:rgba(255,255,255,.06)}
nav a.on{background:var(--nav2);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
nav a i{width:9px;height:9px;border-radius:3px;flex:0 0 9px;background:#5D7086}
.sidefoot{padding:12px;border-top:1px solid rgba(255,255,255,.08);display:grid;gap:6px}
.sidefoot button{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--navink);border-radius:7px;padding:7px;font-size:12px;cursor:pointer}
.sidefoot button:hover{background:rgba(255,255,255,.06)}
/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{background:var(--card);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
#top h1{font-size:19px;margin:0;font-weight:650}
#top .sub{font-size:12px;color:var(--muted)}
#top .tt{flex:1;min-width:220px}
#top .navbtn{font-size:18px;line-height:1;padding:7px 11px;background:var(--nav);color:#fff;border-color:var(--nav)}
#top .navbtn:hover{background:var(--nav2)}
body.navoff #side{display:none}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
select,input[type=text],input[type=number],input[type=search]{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 8px;color:var(--ink)}
.btn{font:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--card2)}
.btn.pri{background:var(--nav);color:#fff;border-color:var(--nav)}
.btn.pri:hover{background:var(--nav2)}
.btn.sm{padding:4px 8px;font-size:12px}
#view{padding:18px 22px 40px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}.c2{grid-column:span 2}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;min-width:0}
.card h3{margin:0 0 2px;font-size:13.5px;font-weight:650}
.card .hint{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,var(--nav2))}
.kpi small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font-size:22px;font-weight:650;margin-top:4px}
.kpi span{font-size:11.5px;color:var(--ink2)}
.ch{position:relative;height:260px}
.ch.tall{height:330px}.ch.sm{height:210px}
.insight{background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink2);margin-bottom:14px;line-height:1.5}
.insight b{color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;color:var(--ink2);background:var(--card2);padding:7px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
td{padding:6px 8px;border-bottom:1px solid #DCE2E8;vertical-align:top}
td.r,th.r{text-align:right}
td.r,td.num{white-space:nowrap}
.kpi b.txt{font-size:15px;line-height:1.3;margin-top:6px}
tr:hover td{background:#EDF1F5}
.tw{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:1px 8px;font-size:11.5px;margin:1px 2px 1px 0;white-space:nowrap}
.bar{height:6px;background:#DCE3EA;border-radius:3px;overflow:hidden;margin-top:3px}
.bar>div{height:100%;background:var(--oco);border-radius:3px}
.st{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}.st.na{color:var(--muted);font-weight:400}
.heat td{text-align:right;font-size:12px;border:2px solid var(--card);white-space:nowrap}
.heat th{background:transparent;border:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:10px}
.toolbar label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.pill.a{background:#dbe9f9;color:#1c5cab}.pill.m{background:#fbeccd;color:#8a5a00}.pill.o{background:#d9f2e6;color:#1d6b45}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cmpc{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.cmpc:hover{border-color:var(--c-cong)}
.cmpc small{color:var(--muted);font-size:11px}
.cmpc b{display:block;font-size:17px;margin:2px 0}
.cmpc canvas{width:100%!important;height:46px!important}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:12px;color:var(--muted)}
#modal{position:fixed;inset:0;background:rgba(15,25,35,.45);display:none;align-items:center;justify-content:center;z-index:50}
#modal .box{background:var(--card);border-radius:12px;width:min(560px,94vw);max-height:84vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#modal .hd{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:650}
#modal .bd{padding:12px 18px;overflow:auto}
#modal .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.eqlist label{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.eqlist .ah{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:10px}
.muted{color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);margin-top:8px}
.printhead{display:none}
#busy{position:fixed;inset:0;background:rgba(15,25,35,.45);color:#fff;font-size:15px;font-weight:600;display:none;align-items:center;justify-content:center;z-index:60}
body.pdfmode #view{width:1520px;padding:12px}
body.pdfmode .ch{height:225px}
body.pdfmode .ch.tall{height:280px}
body.pdfmode .ch.sm{height:170px}
body.pdfmode .grid{gap:12px}
body.pdfmode .kpis{margin-bottom:12px;gap:12px}
body.pdfmode .tw{max-height:none!important;overflow:visible!important}
body.pdfmode .noprint{display:none!important}
body.pdfmode th{position:static}
body.pdfmode .hint{display:none}
body.pdfmode .toolbar{display:none}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.c3{grid-column:span 6}.c4,.c5,.c7,.c8{grid-column:span 12}.c6{grid-column:span 12}}
@media (max-width:820px){
  body{flex-direction:column}
  #side{width:100%;height:auto;position:relative;flex:none}
  nav{display:flex;overflow-x:auto;padding:6px}
  nav .grp{display:none}
  nav a{white-space:nowrap}
  .sidefoot{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid>*{grid-column:span 12!important}
  #top{position:relative;padding:10px 14px}
  #view{padding:12px 12px 30px}
  .brand{padding:10px 14px}
}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;display:block}
  #side,.filters,.noprint,.toolbar,.pager{display:none!important}
  #top{position:static;border:0;padding:0 0 6px}
  #view{padding:0}
  .card,.kpi{box-shadow:none;break-inside:avoid}
  .tw{max-height:none;overflow:visible}
  .printhead{display:block;font-size:11px;color:var(--muted)}
}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><small>Departamento de Mantenimiento</small><b>Costos de Mantenimiento 2026</b><span>Planta Paita · Congelado</span></div>
  <nav id="nav"></nav>
  <div class="sidefoot">
    <button onclick="backupDownload()">Descargar respaldo (.json)</button>
    <button onclick="document.getElementById('fimp').click()">Cargar respaldo</button>

<div id="main">

    <button class="btn navbtn" id="navBtn" title="Mostrar u ocultar módulos" onclick="toggleNav()">☰</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<div id="sim-boot" style="position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:#1D2E40;color:#C9D4DF;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;text-align:center;padding:24px">Verificando acceso…</div>
<script>
// ======== ARRANQUE SIM: sesión del portal + datos desde Firebase ========
(function () {
  const CFG = {
  apiKey: "AIzaSyDqatvNRWGyJJL6Z-HXpLS4LqdBpa9maAM",
  authDomain: "sim-pruebas-bcf39.firebaseapp.com",
  projectId: "sim-pruebas-bcf39",
  storageBucket: "sim-pruebas-bcf39.firebasestorage.app",
  messagingSenderId: "1008990436037",
  appId: "1:1008990436037:web:1b5eb3d0f3d16853380eac"
};
  const ADMIN = 'emiranda@santamonicafishing.com';
  const MODMAP = {"general": "general", "ratio": "ratio", "Congelado": "congelado", "Planta de hielo": "hielo", "Planta de ósmosis": "osmosis", "Calderos": "calderos", "Resto de planta": "resto", "equipos": "equipos", "asignar": "asignar", "catalogo": "catalogo", "capex": "capex"};
  const LSKEY = 'smf_costos_mant_2026_v1';
  firebase.initializeApp(CFG);
  const db = firebase.firestore();
  const base = db.collection('datos').doc('cost');
  const boot = document.getElementById('sim-boot');
  const pantalla = (titulo, texto, extra) => {
    boot.innerHTML = '<div style="max-width:460px;padding:34px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)">'
      + '<div style="font-size:21px;font-weight:600;color:#fff">' + titulo + '</div><p style="line-height:1.6;color:#C9D4DF">' + texto + '</p>'
      + (extra || '') + '<a href="../../" style="display:inline-block;margin-top:6px;padding:11px 20px;border-radius:10px;background:#2BA6A0;color:#fff;font-weight:600;text-decoration:none">Ir al portal</a></div>';
  };

  firebase.auth().onAuthStateChanged(async function (u) {
    if (!u) { location.replace('../../'); return; }
    let perfil = null;
    try { const s = await db.collection('usuarios').doc(u.uid).get(); perfil = s.exists ? s.data() : null; } catch (e) { console.warn('[SIM] perfil', e); }
    const esAdm = (u.email || '').toLowerCase() === ADMIN && u.emailVerified === true;
    const todos = Object.values(MODMAP);
    let rol = null, mods = todos;
    if (esAdm) rol = 'admin';
    else if (perfil && perfil.activo === true && perfil.apps && perfil.apps.cost && perfil.apps.cost.rol) {
      rol = perfil.apps.cost.rol;
      const pm = perfil.apps.cost.modulos;
      if (Array.isArray(pm) && pm.length) mods = pm.filter(m => todos.includes(m));
    }
    if (!rol) { pantalla('Sin acceso', 'Su usuario no tiene permisos para Costos de mantenimiento. Comuníquese con el administrador del sistema.'); return; }
    const escribe = ['admin', 'supervisor', 'operador'].includes(rol);

    // 1. Datos de órdenes
    try {
      boot.textContent = 'Cargando datos…';
      const meta = await base.collection('fuente').doc('meta').get();
      if (!meta.exists) {
        pantalla('Sin datos cargados', 'Aún no se han cargado las órdenes de compra y servicio en el SIM.',
          esAdm ? '<a href="cargar.html" style="display:inline-block;margin:0 8px 0 0;padding:11px 20px;border-radius:10px;border:1px solid rgba(255,255,255,.3);color:#fff;text-decoration:none">Cargar datos</a>' : '');
        return;
      }
      const m = meta.data();
      const partes = await Promise.all(Array.from({ length: m.partes }, (_, i) => base.collection('fuente').doc('p' + i).get()));
      const rows = [];
      partes.forEach(p => { if (p.exists) rows.push.apply(rows, JSON.parse(p.data().json)); });
      window.__COSTOS_DATA = Object.assign({}, JSON.parse(m.extra || '{}'), { rows: rows, cat: JSON.parse(m.cat || '[]') });
      // 2. Estado compartido (asignaciones, dictámenes, catálogo, producción)
      const est = await base.collection('estado').doc('principal').get();
      if (est.exists && est.data().json) localStorage.setItem(LSKEY, est.data().json);
    } catch (e) {
      console.error('[SIM] carga', e);
      pantalla('No se pudieron cargar los datos', (e && e.code) ? ('Código: ' + e.code) : String(e));
      return;
    }

    // 3. Ejecutar el aplicativo
    const app = document.createElement('script');
    app.textContent = document.getElementById('costos-app').textContent;
    document.body.appendChild(app);

    // 4. Módulos según permisos
    for (let i = MODS.length - 1; i >= 0; i--) if (!mods.includes(MODMAP[MODS[i].id])) MODS.splice(i, 1);
    if (!MODS.find(x => x.id === CUR)) CUR = MODS.length ? MODS[0].id : CUR;
    buildNav(); render();

    // 5. Barra lateral: portal, estado de guardado, respaldo solo para Admin
    const side = document.getElementById('side');
    side.insertAdjacentHTML('afterbegin', '<a href="../../" style="display:flex;align-items:center;gap:8px;padding:12px 18px;color:#C9D4DF;text-decoration:none;font-size:13px;border-bottom:1px solid rgba(255,255,255,.08)">⟵ Portal SIM</a>');
    const foot = side.querySelector('.sidefoot');
    if (foot) {
      if (rol !== 'admin') foot.querySelectorAll('button').forEach(b => b.style.display = 'none');
      foot.insertAdjacentHTML('afterbegin', '<div id="sim-sync" style="font-size:11.5px;color:#8FA3B7;text-align:center;padding:2px 0">'
        + (escribe ? 'Cambios guardados en el SIM' : 'Modo consulta: los cambios no se guardan') + '</div>');
    }
    boot.remove();

    // 6. Guardar también en Firebase (con espera para agrupar cambios)
    if (!escribe) return;
    const marca = (t, c) => { const el = document.getElementById('sim-sync'); if (el) { el.textContent = t; el.style.color = c || '#8FA3B7'; } };
    let timer = null;
    const original = window.save;
    window.save = function () {
      original();
      marca('Guardando…');
      clearTimeout(timer);
      timer = setTimeout(async () => {
        try {
          await base.collection('estado').doc('principal').set({ json: JSON.stringify(ST), actualizado: firebase.firestore.FieldValue.serverTimestamp(), por: u.email });
          marca('Cambios guardados en el SIM');
        } catch (e) { console.error('[SIM] guardar', e); marca('No se pudo guardar en el SIM', '#ff9b9b'); }
      }, 1200);
    };
  });
})();
</script>
<script type="text/plain" id="costos-app">
const DATA = window.__COSTOS_DATA;
const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Set','Oct','Nov','Dic'];
const AREAS=['Congelado','Planta de hielo','Planta de ósmosis','Calderos','Resto de planta','Sin asignar'];
const ACOL={'Congelado':'#2a78d6','Calderos':'#eb6834','Planta de hielo':'#1baf7a','Planta de ósmosis':'#eda100','Resto de planta':'#e87ba4','Sin asignar':'#8A96A3'};
const OCO='#256abf', OSR='#86b6ef';
const LS='smf_costos_mant_2026_v1';
const MODS=[
 {id:'general',t:'Dashboard general',g:'Análisis OPEX',c:'#5D7086'},
 {id:'ratio',t:'S/ por TM producida',g:'Análisis OPEX',c:'#2BA6A0',sub:'Costo de mantenimiento por tonelada de producto terminado congelado'},
 {id:'Congelado',t:'Congelado',g:'Análisis OPEX',c:ACOL['Congelado'],sub:'Congeladores de placas, compresores, evaporadores y sistema de refrigeración'},
 {id:'Planta de hielo',t:'Planta de hielo',g:'Análisis OPEX',c:ACOL['Planta de hielo']},
 {id:'Planta de ósmosis',t:'Planta de ósmosis',g:'Análisis OPEX',c:ACOL['Planta de ósmosis']},
 {id:'Calderos',t:'Calderos',g:'Análisis OPEX',c:ACOL['Calderos']},
 {id:'Resto de planta',t:'Resto de planta',g:'Análisis OPEX',c:ACOL['Resto de planta'],sub:'Montacargas, bombas, grupos electrógenos, líneas de proceso, muelle, infraestructura, SS.HH. y exteriores'},
 {id:'equipos',t:'Análisis por equipo',g:'Gestión',c:'#5D7086'},
 {id:'asignar',t:'Asignación de costos',g:'Gestión',c:'#5D7086'},
 {id:'catalogo',t:'Catálogo de equipos',g:'Gestión',c:'#5D7086'},
 {id:'capex',t:'CAPEX',g:'Proyectos',c:'#7a5bbf'},
];
// ---------- state
let ST={asg:{},dict:{},notes:{},catEdit:{},catNew:[],prod:{},meta:null};
try{const s=localStorage.getItem(LS); if(s) ST=Object.assign(ST,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(ST));}catch(e){}}
let CUR='general', SEL_EQ=null, charts={};
const ROWS=DATA.rows;
function catalog(){
  const base=DATA.cat.map(c=>Object.assign({},c,ST.catEdit[c.id]||{}));
  return base.concat(ST.catNew.map(c=>Object.assign({},c,ST.catEdit[c.id]||{})));
}
let CAT=catalog(), CATM={};
function refreshCat(){CAT=catalog();CATM={};CAT.forEach(c=>CATM[c.id]=c);}
refreshCat();
const clsOf=r=> r.c==='CAPEX' && ST.dict[r.i]==='OPEX' ? 'OPEX' : r.c;

function facts(){
  const out=[];
  ROWS.forEach(r=>{
    if(clsOf(r)!=='OPEX'||!inRange(r))return;
    const eq=eqOf(r).filter(e=>CATM[e]);
    if(!eq.length){out.push({r,e:'SIN',a:'Sin asignar',v:r.s});return;}
    eq.forEach(e=>out.push({r,e,a:CATM[e].a,v:r.s/eq.length}));
  });
  return out;
}

function trendData(F){
  const ms=mRange();
  const oc=ms.map(m=>F.filter(x=>x.r.m===m&&x.r.t==='OCO').reduce((a,x)=>a+x.v,0));
  const os=ms.map(m=>F.filter(x=>x.r.m===m&&x.r.t==='OSR').reduce((a,x)=>a+x.v,0));
  const tot=oc.map((v,i)=>v+os[i]); const avg=tot.reduce((a,b)=>a+b,0)/(ms.length||1);
  return {ms,oc,os,tot,avg};
}

function pareto(id,entries,colorFn,onClick){

function heatTable(F,rowsKey,rowsList,colorOf){
  const ms=mRange(); const m={}; let mx=0;
  F.forEach(x=>{const k=rowsKey(x);m[k]=m[k]||{};m[k][x.r.m]=(m[k][x.r.m]||0)+x.v;});
  rowsList.forEach(k=>ms.forEach(mm=>{mx=Math.max(mx,(m[k]||{})[mm]||0);}));
  const lerp=(t)=>{const a=[232,240,251],b=[28,92,171];return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')})`;};
  let h=`<div style="overflow:auto"><table class="heat num"><tr><th></th>${ms.map(mm=>`<th class="r">${MES[mm-1]}</th>`).join('')}<th class="r">Total</th></tr>`;
  rowsList.forEach(k=>{let t=0;h+=`<tr><td style="text-align:left;white-space:nowrap"><span class="dot" style="background:${colorOf(k)}"></span>${esc(k)}</td>`;
    ms.forEach(mm=>{const v=(m[k]||{})[mm]||0;t+=v;const r=mx?v/mx:0;h+=`<td title="${esc(k)} · ${MES[mm-1]}: ${fmt(v)}" style="background:${v?lerp(Math.sqrt(r)):'#F3F5F7'};color:${Math.sqrt(r)>.55?'#fff':'#1B2733'}">${v?fmtk(v).replace('S/ ',''):'–'}</td>`;});
    h+=`<td><b>${fmtk(t)}</b></td></tr>`;});
  return h+'</table></div><div class="note">Intensidad del color proporcional al gasto mensual. Valores en soles (k = miles).</div>';
}
function provTable(F,n=10){

function eqStats(F){
  const ms=mRange(); const nm=ms.length||1; const mid=ms[Math.floor(ms.length/2)];
  const g={}; F.forEach(x=>{if(x.e==='SIN')return;const s=g[x.e]=g[x.e]||{t:0,osr:0,corr:0,prev:0,docs:new Set(),mm:new Set(),h1:0,h2:0};
    s.t+=x.v; if(x.r.t==='OSR')s.osr+=x.v; if(x.r.r==='S. Reparación / correctivo')s.corr+=x.v; if(x.r.r==='S. Mant. preventivo')s.prev+=x.v;
    s.docs.add(x.r.d); s.mm.add(x.r.m); if(x.r.m<mid)s.h1+=x.v; else s.h2+=x.v;});
  const n1=ms.filter(m=>m<mid).length||1, n2=ms.filter(m=>m>=mid).length||1;
  return Object.entries(g).map(([e,s])=>{const c=CATM[e]||{};const anual=s.t/nm*12;const ratio=c.vr?anual/c.vr:null;
    const tr=(s.h1/n1)>=500? ((s.h2/n2)/(s.h1/n1)-1) : null;
    let st=['na','Sin dato'];
    if(ratio!==null){st=ratio>0.30?['bad','Evaluar reemplazo']:ratio>0.15?['warn','Vigilar']:['ok','Normal'];}
    return {e,n:c.n||e,a:c.a,tp:c.tp,t:s.t,pm:s.t/nm,meses:s.mm.size,docs:s.docs.size,posr:s.osr/s.t,corr:s.corr,prev:s.prev,tr,anual,ratio,st,uso:c.uso,cu:c.uso?s.t/c.uso:null};}).sort((a,b)=>b.t-a.t);
}

      pdf.setFillColor(29,46,64);pdf.rect(0,0,PW,HD,'F');pdf.setFillColor(43,166,160);pdf.rect(0,HD,PW,0.8,'F');
      pdf.setTextColor(255,255,255);pdf.setFont('helvetica','bold');pdf.setFontSize(13);pdf.text('Costos de Mantenimiento 2026 · '+m.t,M,9.5);
      pdf.setFont('helvetica','normal');pdf.setFontSize(8.5);pdf.setTextColor(201,212,223);pdf.text(per,PW-M,9.5,{align:'right'});
      const h=Math.round((b-a)*SC); const pc=document.createElement('canvas');pc.width=canvas.width;pc.height=h;
      pc.getContext('2d').drawImage(canvas,0,Math.round(a*SC),canvas.width,h,0,0,canvas.width,h);
      pdf.addImage(pc.toDataURL('image/jpeg',0.92),'JPEG',M,HD+4,cw,(b-a)*k);
      pdf.setFontSize(8);pdf.setTextColor(70,83,95);pdf.text('Elvis Miranda — Departamento de Mantenimiento',M,PH-4);
      pdf.text(`Página ${i+1} de ${slices.length}`,PW-M,PH-4,{align:'right'});
    });
    pdf.save(`Costos_Mantenimiento_${m.t.replace(/[^\wáéíóúñ ]/gi,'').replace(/ +/g,'_')}_${MES[fD.value-1]}-${MES[fH.value-1]}_2026.pdf`);
  }catch(e){alert('No se pudo generar el PDF: '+e.message);}
  PDFMODE=false; document.body.classList.remove('pdfmode'); Chart.defaults.animation=anim; render(); busy(false);
}
// ---------- backup
function backupDownload(){const b=new Blob([JSON.stringify(ST,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='respaldo_costos_mantenimiento.json';a.click();}
function backupLoad(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{ST=Object.assign({asg:{},dict:{},notes:{},catEdit:{},catNew:[],prod:{},meta:null},JSON.parse(rd.result));save();render();alert('Respaldo cargado.');}catch(e){alert('El archivo no es un respaldo válido.');}};rd.readAsText(f);inp.value='';}
function resetAll(){if(confirm('Se borrarán las asignaciones manuales, dictámenes CAPEX y cambios del catálogo guardados en este navegador (la producción ingresada se conserva). ¿Continuar?')){ST=Object.assign({asg:{},dict:{},notes:{},catEdit:{},catNew:[]},{prod:ST.prod||{},meta:ST.meta||null,caph:ST.caph||null,capo:ST.capo||null});save();render();}}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.target.style.display='none';};
function toggleNav(){document.body.classList.toggle('navoff');try{localStorage.setItem(LS+'_nav',document.body.classList.contains('navoff')?'off':'on');}catch(e){}setTimeout(()=>Object.values(charts).forEach(c=>c.resize()),60);}
try{if(localStorage.getItem(LS+'_nav')==='off')document.body.classList.add('navoff');}catch(e){}
buildNav(); render();
