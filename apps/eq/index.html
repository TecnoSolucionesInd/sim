<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipos · SIM</title>
<link rel="stylesheet" href="../../core/sim.css">
<style>
  .pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:24px}
  .pagehead h1{font-size:36px;margin-top:12px}
  .acciones{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
  .kpi{padding:18px 20px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1)}
  .kpi span{display:block;font-size:12.5px;color:var(--tx-3)}
  .kpi b{display:block;font-family:var(--f-display);font-weight:600;font-size:28px;margin-top:6px}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .filtros .chip{height:36px;padding:0 14px;font-size:13px}
  .field.sm{height:40px;font-size:14px;padding:0 12px;border-radius:10px}
  select.field.sm{padding-right:32px;background-position:right 10px center}
  .btn.sm{height:38px;padding:0 14px;font-size:13px;border-radius:10px}
  .lista{border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);overflow:hidden}
  .fila{display:grid;grid-template-columns:130px minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 60px 150px;gap:14px;align-items:center;padding:13px 20px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;color:var(--tx);font-size:14px;transition:background .2s}
  .fila:hover{background:rgba(255,255,255,.04)}
  .fila.hd{font-family:var(--f-mono);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx-3);cursor:default;padding:14px 20px}
  .fila.hd:hover{background:transparent}
  .fila .c{font-family:var(--f-mono);font-size:13px;color:var(--mint-2)}
  .fila .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fila .s{color:var(--tx-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crit{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;font-family:var(--f-mono);font-size:13px;font-weight:600}
  .crit.A{background:rgba(255,143,143,.16);color:#FFB3B3}.crit.B{background:rgba(245,185,74,.16);color:#FFCF73}.crit.C{background:rgba(255,255,255,.08);color:#C3CDD8}
  .mas{display:flex;justify-content:center;padding:16px}
  .vacio{padding:48px 28px;text-align:center}
  .vacio h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0 0 10px}
  .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .ficha{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px}
  .lado h4{margin:0 0 10px;font-family:var(--f-display);font-weight:600;font-size:14px}
  .lado .it{padding:10px 12px;border-radius:12px;background:rgba(14,22,30,.28);margin-bottom:8px;font-size:13px;line-height:1.45}
  .lado .it b{font-family:var(--f-mono);font-size:12px;color:var(--mint-2);font-weight:500}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:18px}
  .panel{padding:22px;border-radius:20px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1)}
  .panel h3{margin:0 0 6px;font-family:var(--f-display);font-weight:600;font-size:17px}
  .panel p{margin:0 0 16px;color:var(--tx-2);font-size:13.5px;line-height:1.55}
  .prev{max-height:420px;overflow:auto;border-radius:14px;border:1px solid rgba(255,255,255,.1)}
  .prev table{width:100%;border-collapse:collapse;font-size:13px}
  .prev th{position:sticky;top:0;background:#3A4757;font-family:var(--f-mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--tx-3);text-align:left;padding:10px 12px;font-weight:500}
  .prev td{padding:9px 12px;border-top:1px solid rgba(255,255,255,.06);vertical-align:top}
  .st{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .st.n{background:rgba(111,227,207,.16);color:#8FF0DE}.st.u{background:rgba(169,180,255,.16);color:#C5CCFF}.st.e{background:rgba(255,143,143,.14);color:#FFB3B3}.st.o{background:rgba(255,255,255,.08);color:#C3CDD8}
  .resumen{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0;font-size:13.5px}
  .codbox{display:flex;align-items:center;font-family:var(--f-mono);font-size:17px;letter-spacing:.5px;color:var(--mint-2);background:rgba(14,22,30,.22);cursor:default}
  .codbox.vac{color:var(--tx-3);font-size:14px;letter-spacing:0}
  .hint{font-size:12px;color:var(--tx-3);margin-top:6px;line-height:1.45}
  .sigrow{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--amber-2)}
  .sigrow input{width:86px;height:36px;font-size:14px;padding:0 10px;border-radius:9px;text-transform:uppercase}
  details.motor{border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 16px;background:rgba(14,22,30,.14)}
  details.motor summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:14px}
  .tabla{width:100%;border-collapse:collapse;font-size:14px}
  .tabla th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx-3);text-align:left;padding:12px 16px;font-weight:500}
  .tabla td{padding:11px 16px;border-top:1px solid rgba(255,255,255,.06)}
  .tabla td.mono{font-family:var(--f-mono);color:var(--mint-2)}
  .tabla tr.sin td{color:var(--amber-2)}
  @media (max-width:1100px){
    .fila{grid-template-columns:110px minmax(0,1fr) 44px;grid-template-areas:"c d k" "c m e";row-gap:4px}
    .fila>:nth-child(1){grid-area:c}.fila>:nth-child(2){grid-area:d}.fila>:nth-child(6){grid-area:k;justify-self:end}.fila>:nth-child(7){grid-area:e;justify-self:end}
    .fila>:nth-child(3),.fila>:nth-child(4){display:none}
    .fila>:nth-child(5){grid-area:m}
    .fila.hd{display:none}
  }
  @media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.pagehead h1{font-size:30px}.ficha{grid-template-columns:minmax(0,1fr)}}
  @media (max-width:640px){
    .g2,.g3{grid-template-columns:minmax(0,1fr)}
    .fila{grid-template-columns:minmax(0,1fr) 40px;grid-template-areas:"c k" "d d" "m e";padding:14px 16px}
    .fila>:nth-child(7){justify-self:start}
  }
</style>
</head>
<body>
<script type="module">
import { iniciarApp, toast, db } from '../../core/core.js';
import { SISTEMAS, sistemaPorId, ESTADOS_EQUIPO, CRITICIDAD, norm } from '../../core/maestros.js';
import { colEquipos, listarEquipos, ordenEquipos, valoresDe } from '../../core/equipos.js';
import { informesVinculados, ESTADOS_INF } from '../../core/informes.js';
import { doc, getDoc, getDocs, collection, query, where, writeBatch, deleteDoc, serverTimestamp, runTransaction } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const I = (d, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const IC = { mas: I('M12 5v14M5 12h14'), x: I('M6 6l12 12M18 6L6 18', 16), xls: I('M4 4h16v16H4zM4 10h16M10 4v16'), up: I('M12 16V4M6 10l6-6 6 6M4 20h16'), down: I('M12 4v12M6 10l6 6 6-6M4 20h16') };

let CTX = null, EQ = [], FIL = { sistema: 'all', ubicacion: '', tipo: '', estado: 'activos', q: '' }, LIM = 150;
const nombreUsuario = () => CTX?.perfil?.nombre || CTX?.user?.email || '';
const puede = () => CTX?.puedeEscribir;

const pillEstado = (id) => { const e = ESTADOS_EQUIPO.find(x => x.id === id) || ESTADOS_EQUIPO[0]; return `<span class="pill" style="background:${e.bg};color:${e.fg}">${e.label}</span>`; };
const sisNom = (id) => sistemaPorId(id)?.nombre || '—';
// Datos de placa del motor (campos planos para Excel y filtros)
const MOTOR = [
  ['mTension', 'Tensión', 'V', '440'], ['mCorriente', 'Corriente nominal', 'A', '92'], ['mRpm', 'Velocidad', 'RPM', '1780'],
  ['mFs', 'Factor de servicio', '', '1.15'], ['mCarcasa', 'Carcasa (frame)', '', '365T'], ['mRodLA', 'Rodamiento lado acople', '', '6316 C3'], ['mRodLOA', 'Rodamiento lado opuesto', '', '6313 C3']
];
const tieneMotor = (v) => MOTOR.some(([k]) => String(v?.[k] ?? '').trim());
const pideMotor = (tipo) => /motor|bomba|ventilador|compresor|agitador|faja/.test(norm(tipo));
const sisDe = (v) => v === '' || v == null ? null : sistemaPorId(v);

// =====================================================================
// CODIFICACIÓN AUTOMÁTICA: <SISTEMA>-<SIGLA DEL TIPO>-<N°>  (REF-CMP-01)
// El número es correlativo por sistema y tipo. El código queda fijo aunque luego cambie el sistema o el tipo,
// y los números de equipos eliminados no se reutilizan (contador en datos/eq/config/contadores).
// =====================================================================
const TIPOS_BASE = [
  ['Compresor', 'CMP'], ['Condensador', 'CND'], ['Evaporador', 'EVA'], ['Recibidor de líquido', 'REC'], ['Separador de líquido', 'SEP'],
  ['Intercambiador de calor', 'ITC'], ['Chiller', 'CHI'], ['Congelador de placas', 'CPL'], ['Túnel de congelamiento', 'TUN'],
  ['Cámara frigorífica', 'CAM'], ['Puerta de cámara', 'PTA'], ['Fabricadora de hielo', 'FHI'], ['Torre de enfriamiento', 'TEN'],
  ['Caldero', 'CAL'], ['Quemador', 'QUE'], ['Bomba', 'BBA'], ['Motor eléctrico', 'MOT'], ['Ventilador', 'VEN'], ['Tanque', 'TNQ'],
  ['Ablandador', 'ABL'], ['Filtro', 'FLT'], ['Unidad de ósmosis inversa', 'UOI'], ['Compresor de aire', 'CAI'], ['Secador de aire', 'SEC'],
  ['Tablero eléctrico', 'TAB'], ['Transformador', 'TRF'], ['Grupo electrógeno', 'GEL'], ['Variador de frecuencia', 'VDF'],
  ['Banco de condensadores', 'BCO'], ['Faja transportadora', 'FAJ'], ['Balanza', 'BAL'], ['Válvula', 'VAL']
].map(([nombre, sigla]) => ({ nombre, sigla }));
let TIPOS = [], CONT = {};
const refTipos = () => doc(db, 'datos', 'eq', 'config', 'tipos');
const refCont = () => doc(db, 'datos', 'eq', 'config', 'contadores');
const tipoPorNombre = (n) => n ? TIPOS.find(t => norm(t.nombre) === norm(n)) || null : null;
const siglaValida = (s) => /^[A-Z]{2,4}$/.test(s || '');
const siglaLibre = (s, salvo = null) => !TIPOS.some(t => t !== salvo && t.sigla === s);
const NO_SIG = ['DE', 'DEL', 'LA', 'EL', 'LOS', 'LAS', 'Y', 'PARA', 'CON', 'A', 'EN', 'N'];
function siglaSugerida(nombre, extra = []) {
  const w = norm(nombre).toUpperCase().replace(/[^A-Z ]/g, ' ').split(/\s+/).filter(x => x && !NO_SIG.includes(x));
  if (!w.length) return '';
  const p = w[0], cons = p.slice(1).replace(/[AEIOU]/g, '');
  const cand = [(p[0] + cons).slice(0, 3), w.length > 2 ? w[0][0] + w[1][0] + w[2][0] : '', w[1] ? p[0] + (cons[0] || p[1] || '') + w[1][0] : '', p.slice(0, 3)];
  const libre = (s) => s.length === 3 && siglaLibre(s) && !extra.includes(s);
  const c = cand.find(libre);
  if (c) return c;
  for (const l of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') { const s = p.slice(0, 2).padEnd(2, 'X') + l; if (libre(s)) return s; }
  return '';
}
const reCod = (p) => new RegExp(`^${p}-(\\d+)$`, 'i');
const maxLocal = (p) => EQ.reduce((m, e) => { const x = String(e.codigo || '').match(reCod(p)); return x ? Math.max(m, +x[1]) : m; }, 0);
const fmtCod = (p, n) => `${p}-${String(n).padStart(2, '0')}`;
const prefijo = (sistema, sigla) => { const s = sisDe(sistema); return s && siglaValida(sigla) ? `${s.corto}-${sigla}` : null; };
const prefijoEq = (e) => prefijo(e.sistema, tipoPorNombre(e.tipo)?.sigla);
const proximo = (p) => fmtCod(p, Math.max(+CONT[p] || 0, maxLocal(p)) + 1);
const sigueFormato = (e) => { const p = prefijoEq(e); return !!p && reCod(p).test(e.codigo || ''); };
const usaSigla = (s) => EQ.some(e => new RegExp(`^[A-Z]+-${s}-\\d+$`).test(e.codigo || '')) || Object.keys(CONT).some(k => k.endsWith('-' + s));

// Asigna códigos en lote (importaciones): parte del contador y de lo ya registrado
function planificador() {
  const loc = {};
  const sig = (p) => { const n = (loc[p] ?? Math.max(+CONT[p] || 0, maxLocal(p))) + 1; loc[p] = n; return fmtCod(p, n); };
  return { sig, loc };
}
async function cargarCodificacion() {
  try {
    const [t, c] = await Promise.all([getDoc(refTipos()), getDoc(refCont())]);
    TIPOS = t.exists() && Array.isArray(t.data().lista) ? t.data().lista : TIPOS_BASE.map(x => ({ ...x }));
    CONT = c.exists() ? c.data() : {};
    const u = await getDoc(refUbic());
    UBIC = u.exists() && Array.isArray(u.data().lista) ? u.data().lista : null;
  } catch (e) { TIPOS = TIPOS_BASE.map(x => ({ ...x })); CONT = {}; UBIC = null; }
}
// ---- Ubicaciones: lista controlada (datos/eq/config/ubicaciones.lista [nombre]) para no duplicar por errores de tipeo
let UBIC = [];
const refUbic = () => doc(db, 'datos', 'eq', 'config', 'ubicaciones');
const listaUbic = () => [...UBIC].sort((a, b) => a.localeCompare(b, 'es'));
const ubicPorNombre = (n) => n ? UBIC.find(u => norm(u) === norm(n)) || null : null;
function distancia(a, b) {
  a = norm(a); b = norm(b);
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
// ubicación de la lista muy parecida (posible error de tipeo)
const ubicParecida = (n, lista = UBIC) => { const t = norm(n); return lista.find(u => norm(u) !== t && distancia(u, n) <= Math.max(2, Math.floor(t.length / 10))) || null; };
const listaTipos = () => [...TIPOS].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

// ---------------- modal ----------------
function modal({ titulo, cuerpo, pie, ancho = 640 }) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<form class="modal" novalidate style="max-width:${ancho}px">
    <div class="modal-h"><div style="font-family:var(--f-display);font-weight:600;font-size:20px">${titulo}</div>
      <button type="button" class="btn btn-icon" data-x aria-label="Cerrar">${IC.x}</button></div>
    <div class="modal-b">${cuerpo}<div class="alert err" data-err style="margin-top:16px" hidden></div></div>
    <div class="modal-f">${pie}</div></form>`;
  document.body.appendChild(bg);
  const cerrar = () => bg.remove();
  bg.querySelectorAll('[data-x]').forEach(b => b.onclick = cerrar);
  bg.addEventListener('mousedown', (e) => { if (e.target === bg) cerrar(); });
  const $ = (s) => bg.querySelector(s);
  const err = (t) => { const e = $('[data-err]'); e.hidden = !t; e.textContent = t || ''; if (t) e.scrollIntoView({ block: 'nearest' }); };
  return { bg, $, cerrar, err, form: bg.querySelector('form') };
}

// =====================================================================
// BASE DE EQUIPOS
// =====================================================================
function filtrados() {
  const q = norm(FIL.q);
  return EQ.filter(e => {
    if (FIL.sistema !== 'all' && Number(e.sistema) !== FIL.sistema) return false;
    if (FIL.ubicacion && norm(e.ubicacion) !== norm(FIL.ubicacion)) return false;
    if (FIL.tipo && norm(e.tipo) !== norm(FIL.tipo)) return false;
    if (FIL.estado === 'activos' && e.estado === 'baja') return false;
    if (!['activos', 'todos'].includes(FIL.estado) && (e.estado || 'operativo') !== FIL.estado) return false;
    if (q && !norm(`${e.codigo} ${e.descripcion} ${e.marca} ${e.modelo} ${e.serie} ${e.ubicacion} ${e.tipo}`).includes(q)) return false;
    return true;
  });
}

function vistaBase(main) {
  const act = EQ.filter(e => e.estado !== 'baja');
  main.innerHTML = `
    <div class="pagehead">
      <div><div class="eyebrow rise">Equipos</div><h1 class="h-display rise d1">Base de equipos</h1></div>
      <div class="acciones rise d2">
        ${EQ.length ? `<button class="btn" id="bXls">${IC.xls}Excel</button>` : ''}
        ${puede() ? `<button class="btn btn-primary" id="bNuevo">${IC.mas}Nuevo equipo</button>` : ''}
      </div>
    </div>
    ${EQ.length ? `
    <div class="kpis rise d2">
      <div class="kpi"><span>Equipos activos</span><b>${act.length}</b></div>
      <div class="kpi"><span>Operativos</span><b style="color:var(--mint-2)">${act.filter(e => (e.estado || 'operativo') === 'operativo').length}</b></div>
      <div class="kpi"><span>Fuera de servicio</span><b style="color:var(--amber-2)">${act.filter(e => e.estado === 'fuera').length}</b></div>
      <div class="kpi"><span>Criticidad A</span><b style="color:#FFB3B3">${act.filter(e => e.criticidad === 'A').length}</b></div>
    </div>
    <div class="filtros rise d3">
      <button class="chip ${FIL.sistema === 'all' ? 'on' : ''}" data-s="all">Todos</button>
      ${SISTEMAS.filter(s => EQ.some(e => Number(e.sistema) === s.id)).map(s => `<button class="chip ${FIL.sistema === s.id ? 'on' : ''}" data-s="${s.id}">${esc(s.nombre)}</button>`).join('')}
    </div>
    <div class="filtros rise d3">
      <label class="sr" for="fU">Ubicación</label><select class="field sm" id="fU" style="width:auto;max-width:220px"><option value="">Todas las ubicaciones</option>${valoresDe(EQ, 'ubicacion').map(v => `<option ${norm(v) === norm(FIL.ubicacion) ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>
      <label class="sr" for="fT">Tipo</label><select class="field sm" id="fT" style="width:auto;max-width:220px"><option value="">Todos los tipos</option>${valoresDe(EQ, 'tipo').map(v => `<option ${norm(v) === norm(FIL.tipo) ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>
      <label class="sr" for="fE">Estado</label><select class="field sm" id="fE" style="width:auto">${[['activos', 'Activos'], ['operativo', 'Operativos'], ['fuera', 'Fuera de servicio'], ['baja', 'De baja'], ['todos', 'Todos']].map(([v, l]) => `<option value="${v}" ${FIL.estado === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <span style="flex-grow:1"></span>
      <label class="sr" for="fQ">Buscar</label><input class="field sm" id="fQ" type="search" placeholder="Buscar código, descripción, marca…" value="${esc(FIL.q)}" style="flex:0 1 280px;min-width:0">
    </div>
    <div class="lista rise d4" id="lista"></div>`
    : `<div class="glass vacio rise d2">
        <h2>Aún no hay equipos registrados</h2>
        <p class="muted" style="max-width:540px;margin:0 auto 24px;line-height:1.6">Registre los equipos uno por uno, cárguelos desde una plantilla Excel o importe el catálogo de equipos del aplicativo Costos.</p>
        ${puede() ? `<div class="acciones" style="justify-content:center"><a class="btn btn-primary" href="#carga">${IC.up}Carga masiva</a><button class="btn" id="bNuevo2">${IC.mas}Nuevo equipo</button></div>` : ''}
      </div>`}`;
  const $ = (s) => main.querySelector(s);
  if ($('#bNuevo')) $('#bNuevo').onclick = () => ficha(null);
  if ($('#bNuevo2')) $('#bNuevo2').onclick = () => ficha(null);
  if ($('#bXls')) $('#bXls').onclick = () => exportar(filtrados());
  main.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    FIL.sistema = b.dataset.s === 'all' ? 'all' : Number(b.dataset.s); LIM = 150;
    main.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === b)); pintarLista(main);
  });
  if ($('#fU')) $('#fU').onchange = (e) => { FIL.ubicacion = e.target.value; LIM = 150; pintarLista(main); };
  if ($('#fT')) $('#fT').onchange = (e) => { FIL.tipo = e.target.value; LIM = 150; pintarLista(main); };
  if ($('#fE')) $('#fE').onchange = (e) => { FIL.estado = e.target.value; LIM = 150; pintarLista(main); };
  if ($('#fQ')) $('#fQ').oninput = (e) => { FIL.q = e.target.value; LIM = 150; pintarLista(main); };
  pintarLista(main);
}

function pintarLista(main) {
  const box = main.querySelector('#lista');
  if (!box) return;
  const f = filtrados();
  box.innerHTML = `<div class="fila hd"><span>Código</span><span>Descripción</span><span>Sistema</span><span>Ubicación</span><span>Tipo</span><span>Crit.</span><span>Estado</span></div>
    ${f.slice(0, LIM).map(e => `<button class="fila" data-id="${e.id}">
      <span class="c">${esc(e.codigo)}</span>
      <span class="t">${esc(e.descripcion)}</span>
      <span class="s">${esc(sisNom(e.sistema))}</span>
      <span class="s">${esc(e.ubicacion || '—')}</span>
      <span class="s">${esc(e.tipo || '—')}</span>
      <span>${e.criticidad ? `<span class="crit ${e.criticidad}">${e.criticidad}</span>` : ''}</span>
      <span>${pillEstado(e.estado || 'operativo')}</span>
    </button>`).join('') || '<div class="muted" style="padding:22px 20px">Ningún equipo coincide con el filtro.</div>'}
    ${f.length > LIM ? `<div class="mas"><button class="btn sm" id="bMas">Mostrar más (${f.length - LIM} restantes)</button></div>` : ''}
    <div style="padding:12px 20px;font-size:12.5px;color:var(--tx-3)">${f.length} de ${EQ.length} equipos</div>`;
  box.querySelectorAll('[data-id]').forEach(b => b.onclick = () => ficha(EQ.find(e => e.id === b.dataset.id)));
  const m = box.querySelector('#bMas'); if (m) m.onclick = () => { LIM += 300; pintarLista(main); };
}

// ---------------- ficha del equipo ----------------
function ficha(e, base = null) {
  const nuevo = !e;
  const ro = !puede();
  const dis = ro ? 'disabled' : '';
  const v = e || { codigo: '', descripcion: '', sistema: base?.sistema ?? (FIL.sistema === 'all' ? '' : FIL.sistema), ubicacion: base?.ubicacion ?? FIL.ubicacion, tipo: base?.tipo ?? FIL.tipo, marca: base?.marca || '', modelo: base?.modelo || '', serie: '', potencia: base?.potencia || '', criticidad: base?.criticidad || '', estado: 'operativo', notas: '', ...Object.fromEntries(MOTOR.map(([k]) => [k, base?.[k] || ''])) };
  const dl = (id, campo) => `<datalist id="${id}">${valoresDe(EQ, campo).map(x => `<option value="${esc(x)}">`).join('')}</datalist>`;
  const nombresTipo = [...new Map([...listaTipos().map(t => t.nombre), ...valoresDe(EQ, 'tipo')].map(x => [norm(x), x])).values()];
  const recodificable = !nuevo && !ro && CTX.rol === 'admin' && !sigueFormato(v);
  const m = modal({
    titulo: nuevo ? 'Nuevo equipo' : esc(v.codigo), ancho: nuevo ? 720 : 980,
    cuerpo: `<div class="${nuevo ? '' : 'ficha'}"><div>
      <div class="g2">
        <div><span class="label">Código</span><div class="field codbox" id="eCod" aria-live="polite">${nuevo ? '' : esc(v.codigo)}</div>
          <div class="hint" id="eCodH"></div>
          ${recodificable ? '<button type="button" class="btn sm" id="eRec" style="margin-top:8px" hidden>Asignar código automático</button>' : ''}</div>
        <div><label class="label" for="eSis">Sistema</label><select class="field" id="eSis" ${dis}><option value="">Seleccione</option>${SISTEMAS.map(s => `<option value="${s.id}" ${String(s.id) === String(v.sistema) ? 'selected' : ''}>${esc(s.nombre)} · ${s.corto}</option>`).join('')}</select></div>
        <div><label class="label" for="eTip">Tipo de equipo</label><input class="field" id="eTip" list="dlTip" value="${esc(v.tipo)}" placeholder="Compresor" autocomplete="off" ${dis}>
          <datalist id="dlTip">${nombresTipo.map(x => `<option value="${esc(x)}">${esc(tipoPorNombre(x)?.sigla || 'sin sigla')}</option>`).join('')}</datalist>
          <div class="sigrow" id="eSigBox" hidden><label for="eSig">Tipo nuevo · sigla</label><input class="field mono" id="eSig" maxlength="4" autocomplete="off"></div></div>
        <div><label class="label" for="eUbi">Ubicación</label><select class="field" id="eUbi" ${dis}>
            <option value="">Sin ubicación</option>
            ${v.ubicacion && !ubicPorNombre(v.ubicacion) ? `<option value="${esc(v.ubicacion)}" selected>${esc(v.ubicacion)} (fuera de la lista)</option>` : ''}
            ${listaUbic().map(u => `<option value="${esc(u)}" ${norm(u) === norm(v.ubicacion) ? 'selected' : ''}>${esc(u)}</option>`).join('')}
            ${ro ? '' : '<option value="__nueva">+ Nueva ubicación…</option>'}
          </select>
          <div id="eUbiN" hidden style="margin-top:8px"><input class="field" id="eUbiTx" placeholder="Nombre de la nueva ubicación" autocomplete="off"><div class="hint" id="eUbiH"></div></div></div>
        <div style="grid-column:1/-1"><label class="label" for="eDes">Descripción</label><input class="field" id="eDes" value="${esc(v.descripcion)}" placeholder="Compresor de tornillo N° 1" ${dis}></div>
        <div><label class="label" for="eMar">Marca</label><input class="field" id="eMar" list="dlMar" value="${esc(v.marca)}" ${dis}>${dl('dlMar', 'marca')}</div>
        <div><label class="label" for="eMod">Modelo</label><input class="field" id="eMod" value="${esc(v.modelo)}" ${dis}></div>
        <div><label class="label" for="eSer">N° de serie</label><input class="field" id="eSer" value="${esc(v.serie)}" ${dis}></div>
        <div><label class="label" for="ePot">Potencia / capacidad</label><input class="field" id="ePot" value="${esc(v.potencia)}" placeholder="250 HP" ${dis}></div>
        <div><label class="label" for="eCri">Criticidad</label><select class="field" id="eCri" ${dis}><option value="">Sin definir</option>${CRITICIDAD.map(c => `<option value="${c.id}" ${c.id === v.criticidad ? 'selected' : ''} title="${esc(c.desc)}">${c.label}</option>`).join('')}</select></div>
        <div><label class="label" for="eEst">Estado</label><select class="field" id="eEst" ${dis}>${ESTADOS_EQUIPO.map(s => `<option value="${s.id}" ${s.id === (v.estado || 'operativo') ? 'selected' : ''}>${s.label}</option>`).join('')}</select></div>
        <details class="motor" id="eMot" style="grid-column:1/-1" ${tieneMotor(v) || pideMotor(v.tipo) ? 'open' : ''}>
          <summary>Datos de placa del motor</summary>
          <div class="g3" style="margin-top:12px">${MOTOR.map(([k, l, u, ph]) => `<div><label class="label" for="${k}">${l}${u ? ` (${u})` : ''}</label><input class="field" id="${k}" value="${esc(v[k] || '')}" placeholder="${ph}" ${k === 'mTension' || k === 'mCorriente' || k === 'mRpm' || k === 'mFs' ? 'inputmode="decimal"' : ''} ${dis}></div>`).join('')}</div>
          <div class="hint">La corriente nominal sirve para regular el relé térmico y comparar con la medida en operación (% de carga).</div>
        </details>
        <div style="grid-column:1/-1"><label class="label" for="eNot">Notas</label><textarea class="field" id="eNot" rows="2" style="height:auto;padding:12px 16px;line-height:1.5" ${dis}>${esc(v.notas)}</textarea></div>
      </div></div>
      ${nuevo ? '' : `<div class="lado">
        <h4>Formatos que le aplican</h4><div id="lFmt"><div class="skel" style="height:40px"></div></div>
        <h4 style="margin-top:20px">Últimos registros</h4><div id="lReg"><div class="skel" style="height:40px"></div></div>
        <h4 style="margin-top:20px">Informes técnicos</h4><div id="lInf"><div class="skel" style="height:40px"></div></div>
      </div>`}
    </div>`,
    pie: ro ? '<button type="button" class="btn" data-x>Cerrar</button>'
      : `${!nuevo && CTX.rol === 'admin' ? '<button type="button" class="btn btn-danger" id="eDel" style="margin-right:auto">Eliminar</button>' : ''}<button type="button" class="btn" data-x>Cancelar</button>${nuevo ? '<button type="submit" class="btn" id="eOtro" data-otro="1">Registrar y agregar otro</button>' : ''}<button type="submit" class="btn btn-primary" id="eOk">${nuevo ? 'Registrar equipo' : 'Guardar cambios'}</button>`
  });
  if (!nuevo) relacionados(v, m);

  // tipo y sigla vigentes según lo escrito en pantalla
  const tipoPantalla = () => {
    const nombre = m.$('#eTip').value.trim();
    const t = tipoPorNombre(nombre);
    return { nombre: t ? t.nombre : nombre, t, sigla: t ? t.sigla : m.$('#eSig').value.trim().toUpperCase() };
  };
  const actCod = () => {
    const tp = tipoPantalla();
    const sigBox = m.$('#eSigBox'), sig = m.$('#eSig');
    sigBox.hidden = ro || !tp.nombre || !!tp.t;
    if (!sigBox.hidden && !sig.dataset.edit) { sig.value = siglaSugerida(tp.nombre); tp.sigla = sig.value; }
    const cod = m.$('#eCod'), h = m.$('#eCodH');
    if (nuevo) {
      const p = prefijo(m.$('#eSis').value, tp.sigla);
      cod.textContent = p ? proximo(p) : 'Se genera con el sistema y el tipo';
      cod.classList.toggle('vac', !p);
      h.textContent = p ? 'Se asigna al registrar.' : '';
    } else {
      const p = prefijo(m.$('#eSis').value, tp.sigla);
      const ok = p && reCod(p).test(v.codigo || '');
      h.textContent = ok || !p ? 'El código es fijo: no cambia aunque luego se modifique el sistema o el tipo.'
        : `No coincide con el sistema y tipo actuales (le correspondería ${proximo(p)}).`;
      const r = m.$('#eRec'); if (r) r.hidden = !p || ok;
    }
  };
  if (!ro) {
    m.$('#eSis').onchange = actCod;
    m.$('#eTip').oninput = () => { actCod(); if (pideMotor(m.$('#eTip').value)) m.$('#eMot').open = true; };
    m.$('#eUbi').onchange = () => { const n = m.$('#eUbi').value === '__nueva'; m.$('#eUbiN').hidden = !n; if (n) m.$('#eUbiTx').focus(); };
    m.$('#eUbiTx').oninput = () => {
      delete m.form.dataset.ubicOk;
      const t = m.$('#eUbiTx').value.trim(), ya = ubicPorNombre(t), par = !ya && t.length > 3 ? ubicParecida(t) : null;
      m.$('#eUbiH').innerHTML = ya ? `Ya existe: <b>${esc(ya)}</b> (se usará esa).` : par ? `<span style="color:var(--amber-2)">¿Quiso decir <b>${esc(par)}</b>?</span> <button type="button" class="btn sm" id="eUbiUsa" style="height:28px;margin-left:6px">Usar esa</button>` : '';
      const b = m.$('#eUbiUsa'); if (b) b.onclick = () => { m.$('#eUbi').value = par; m.$('#eUbiN').hidden = true; m.$('#eUbiTx').value = ''; m.$('#eUbiH').innerHTML = ''; };
    };
    m.$('#eSig').oninput = (ev) => { ev.target.dataset.edit = '1'; ev.target.value = ev.target.value.toUpperCase().replace(/[^A-Z]/g, ''); actCod(); };
  }
  actCod();
  if (nuevo) setTimeout(() => m.$(v.sistema === '' ? '#eSis' : v.tipo ? '#eDes' : '#eTip').focus(), 50);

  if (m.$('#eDel')) m.$('#eDel').onclick = async () => {
    if (!confirm(`¿Eliminar ${v.codigo} de la base? Los registros ya llenados conservan sus datos y su número no se reutiliza. Para retirarlo del uso, se recomienda marcarlo "De baja".`)) return;
    try { await deleteDoc(doc(colEquipos(), v.id)); EQ = EQ.filter(x => x.id !== v.id); m.cerrar(); toast('Equipo eliminado.'); render(); }
    catch (er) { m.err('No se pudo eliminar: ' + (er.code || er.message)); }
  };
  if (m.$('#eRec')) m.$('#eRec').onclick = async () => {
    const tp = tipoPantalla();
    if (!tp.t) return m.err('Guarde primero el tipo nuevo con su sigla.');
    if (String(m.$('#eSis').value) !== String(v.sistema) || norm(tp.nombre) !== norm(v.tipo)) return m.err('Guarde primero los cambios de sistema o tipo.');
    if (!confirm(`Se reemplazará el código ${v.codigo} por uno automático. Los registros de formatos e informes ya vinculados conservan el código anterior (queda guardado en la ficha). ¿Continuar?`)) return;
    try {
      const p = prefijoEq(v); let cod = '';
      await runTransaction(db, async (tx) => {
        const cs = await tx.get(refCont());
        const n = Math.max(+(cs.exists() ? cs.data()[p] : 0) || 0, maxLocal(p)) + 1;
        cod = fmtCod(p, n);
        tx.set(refCont(), { [p]: n }, { merge: true });
        tx.set(doc(colEquipos(), v.id), { codigo: cod, codigoAnterior: v.codigo, actualizado: serverTimestamp(), actualizadoPor: nombreUsuario() }, { merge: true });
      });
      CONT[p] = Math.max(+CONT[p] || 0, +cod.split('-').pop());
      const ant = v.codigo; v.codigoAnterior = ant; v.codigo = cod; EQ.sort(ordenEquipos);
      m.cerrar(); toast(`${ant} → ${cod}`); render();
    } catch (er) { m.err('No se pudo asignar: ' + (er.code || er.message)); }
  };
  if (ro) return;

  m.form.onsubmit = async (ev) => {
    ev.preventDefault(); m.err('');
    const otro = ev.submitter?.dataset.otro === '1';
    const tp = tipoPantalla();
    const d = {
      descripcion: m.$('#eDes').value.trim(),
      sistema: m.$('#eSis').value === '' ? '' : Number(m.$('#eSis').value),
      ubicacion: m.$('#eUbi').value === '__nueva' ? m.$('#eUbiTx').value.trim().replace(/\s+/g, ' ') : m.$('#eUbi').value, tipo: tp.nombre, marca: m.$('#eMar').value.trim(),
      modelo: m.$('#eMod').value.trim(), serie: m.$('#eSer').value.trim(), potencia: m.$('#ePot').value.trim(),
      criticidad: m.$('#eCri').value, estado: m.$('#eEst').value, notas: m.$('#eNot').value.trim()
    };
    MOTOR.forEach(([k]) => { d[k] = m.$('#' + k).value.trim().replace(',', k === 'mCarcasa' || k.startsWith('mRod') ? ',' : '.'); });
    if (d.sistema === '') return m.err('Seleccione el sistema.');
    if (!d.tipo) return m.err('Ingrese el tipo de equipo.');
    let tipoNuevo = null;
    if (!tp.t) {
      if (!siglaValida(tp.sigla)) return m.err('La sigla del tipo nuevo debe tener de 2 a 4 letras.');
      const usada = TIPOS.find(t => t.sigla === tp.sigla);
      if (usada) return m.err(`La sigla ${tp.sigla} ya corresponde a "${usada.nombre}". Elija otra o use ese tipo.`);
      tipoNuevo = { nombre: d.tipo, sigla: tp.sigla };
    }
    if (!d.descripcion) return m.err('Ingrese la descripción.');
    let ubicNueva = null;
    if (m.$('#eUbi').value === '__nueva') {
      if (!d.ubicacion) return m.err('Escriba el nombre de la nueva ubicación o elija una de la lista.');
      const ya = ubicPorNombre(d.ubicacion);
      if (ya) d.ubicacion = ya;
      else {
        const par = ubicParecida(d.ubicacion);
        if (par && !m.form.dataset.ubicOk) { m.form.dataset.ubicOk = '1'; return m.err(`"${d.ubicacion}" se parece a "${par}". Si es otra ubicación, vuelva a pulsar Registrar; si es la misma, elíjala de la lista.`); }
        ubicNueva = d.ubicacion;
      }
    }
    // respeta la forma ya escrita de la marca para no duplicar por tildes o mayúsculas
    { const ya = valoresDe(EQ, 'marca').find(x => norm(x) === norm(d.marca)); if (ya) d.marca = ya; }
    const bs = m.form.querySelectorAll('button[type=submit]'); bs.forEach(b => b.disabled = true);
    const b = otro ? m.$('#eOtro') : m.$('#eOk'); const txt = b.textContent; b.textContent = 'Guardando…';
    const tiposDespues = tipoNuevo ? [...TIPOS, tipoNuevo] : TIPOS;
    try {
      const meta = { actualizado: serverTimestamp(), actualizadoPor: nombreUsuario() };
      if (nuevo) {
        const p = prefijo(d.sistema, tp.sigla);
        const ref = doc(colEquipos());
        await runTransaction(db, async (tx) => {
          const cs = await tx.get(refCont());
          const n = Math.max(+(cs.exists() ? cs.data()[p] : 0) || 0, maxLocal(p)) + 1;
          d.codigo = fmtCod(p, n);
          tx.set(refCont(), { [p]: n }, { merge: true });
          if (tipoNuevo) tx.set(refTipos(), { lista: tiposDespues });
          if (ubicNueva) tx.set(refUbic(), { lista: [...UBIC, ubicNueva] });
          tx.set(ref, { ...d, creado: serverTimestamp(), ...meta });
        });
        CONT[p] = Math.max(+CONT[p] || 0, +d.codigo.split('-').pop());
        EQ.push({ id: ref.id, ...d });
      } else {
        const batch = writeBatch(db);
        if (tipoNuevo) batch.set(refTipos(), { lista: tiposDespues });
        if (ubicNueva) batch.set(refUbic(), { lista: [...UBIC, ubicNueva] });
        batch.set(doc(colEquipos(), v.id), { ...d, ...meta }, { merge: true });
        await batch.commit();
        Object.assign(v, d);
      }
      TIPOS = tiposDespues;
      if (ubicNueva) UBIC = [...UBIC, ubicNueva];
      EQ.sort(ordenEquipos);
      m.cerrar(); toast(nuevo ? `${d.codigo} registrado.` : 'Cambios guardados.'); render();
      if (otro) ficha(null, d);
    } catch (er) { m.err('No se pudo guardar: ' + (er.code || er.message)); bs.forEach(x => x.disabled = false); b.textContent = txt; }
  };
}

// formatos vigentes que usan este equipo y últimos registros (requiere acceso de lectura a Registro de formatos)
async function relacionados(e, m) {
  const fBox = m.$('#lFmt'), rBox = m.$('#lReg'), iBox = m.$('#lInf');
  informesVinculados({ equipo: e.id }).then(l => {
    if (!iBox) return;
    if (l === null) { iBox.innerHTML = '<div class="muted" style="font-size:13px">Sin acceso a Informes técnicos.</div>'; return; }
    iBox.innerHTML = l.slice(0, 8).map(x => `<a class="it" style="display:block;text-decoration:none;color:inherit" href="../inf/?i=${encodeURIComponent(x.id)}#informes"><b>${esc(x.codigo)}</b> ${esc(x.titulo)}<div style="color:var(--tx-3);font-size:12px;margin-top:2px">${esc(x.fecha || '')} · ${esc((ESTADOS_INF[x.estado] || {}).label || x.estado)}</div></a>`).join('')
      || '<div class="muted" style="font-size:13px">Sin informes vinculados.</div>';
  });
  try {
    const s = await getDocs(collection(db, 'datos', 'fmt', 'plantillas'));
    const out = [];
    s.docs.map(d => d.data()).filter(p => p.estado === 'vigente' && p.def).sort((a, b) => String(a.codigo).localeCompare(b.codigo)).forEach(p => {
      const usos = [];
      p.def.secciones.forEach(sec => {
        if (sec.tipo === 'tabla' && sec.fuente === 'equipos' && aplica(e, sec.filtro)) usos.push(sec.titulo);
        (sec.campos || []).forEach(c => { if (c.tipo === 'equipo' && aplica(e, c.filtro)) usos.push(c.etiqueta); });
      });
      if (usos.length) out.push(`<div class="it"><b>${esc(p.codigo)}</b> ${esc(p.def.nombre)}<div style="color:var(--tx-3);font-size:12px;margin-top:2px">${esc([...new Set(usos)].join(' · '))}</div></div>`);
    });
    fBox.innerHTML = out.join('') || '<div class="muted" style="font-size:13px">Ningún formato vigente lo incluye.</div>';
  } catch { fBox.innerHTML = '<div class="muted" style="font-size:13px">Sin acceso a Registro de formatos.</div>'; }
  try {
    const s = await getDocs(query(collection(db, 'datos', 'fmt', 'registros'), where('equipos', 'array-contains', e.codigo)));
    const regs = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(b.enviado || '').localeCompare(String(a.enviado || ''))).slice(0, 8);
    const ESTR = { enviado: 'Por revisar', observado: 'Observado', aprobado: 'Aprobado' };
    rBox.innerHTML = regs.map(r => `<a class="it" style="display:block;text-decoration:none;color:inherit" href="../fmt/?r=${encodeURIComponent(r.id)}#registros"><b>${esc(r.numero || r.codigo)}</b> ${esc(r.nombre || '')}<div style="color:var(--tx-3);font-size:12px;margin-top:2px">${esc(r.fechaOp || '')} · ${esc(ESTR[r.estado] || r.estado)}${r.nAlertas ? ` · ${r.nAlertas} alerta${r.nAlertas > 1 ? 's' : ''}` : ''}</div></a>`).join('')
      || '<div class="muted" style="font-size:13px">Sin registros todavía.</div>';
  } catch { rBox.innerHTML = '<div class="muted" style="font-size:13px">Sin acceso a Registro de formatos.</div>'; }
}
const aplica = (e, f) => {
  if (!f) return false;
  const vacio = (f.sistema === '' || f.sistema == null) && !f.tipo && (!f.ubicacion || f.ubicacion === '*');
  if (vacio) return false; // los campos sin filtro aplican a todos; no se listan uno por uno
  return (f.sistema === '' || f.sistema == null || Number(e.sistema) === Number(f.sistema))
    && (!f.tipo || norm(e.tipo) === norm(f.tipo))
    && (!f.ubicacion || f.ubicacion === '*' || norm(e.ubicacion) === norm(f.ubicacion));
};

const COLS = [
  ['codigo', 'Código'], ['descripcion', 'Descripción'], ['sistema', 'Sistema'], ['ubicacion', 'Ubicación'], ['tipo', 'Tipo'],
  ['marca', 'Marca'], ['modelo', 'Modelo'], ['serie', 'N° serie'], ['potencia', 'Potencia'], ['criticidad', 'Criticidad'], ['estado', 'Estado'], ['notas', 'Notas'],
  ...MOTOR.map(([k, l, u]) => [k, `Motor ${l.toLowerCase()}${u ? ` (${u})` : ''}`])
];
const ANCHOS = [12, 34, 22, 20, 18, 14, 14, 14, 12, 10, 16, 30, 12, 14, 12, 12, 14, 18, 18];

function vistaCarga(main) {
  if (!puede()) { main.innerHTML = '<div class="alert warn">Su rol en Equipos es de solo consulta.</div>'; return; }
  main.innerHTML = `
    <div class="pagehead"><div><div class="eyebrow rise">Equipos</div><h1 class="h-display rise d1">Carga masiva</h1></div></div>
    <div class="cards">

    <div class="prev"><table>

      <button class="btn btn-primary" id="rOk" ${ok.length ? '' : 'disabled'}>Asignar ${ok.length} código${ok.length === 1 ? '' : 's'}</button>
    </div></div>`;
  box.querySelector('#rCan').onclick = () => { box.innerHTML = ''; };
  box.querySelector('#rOk').onclick = async (ev) => {
    const b = ev.currentTarget; b.disabled = true; b.textContent = 'Asignando…';
    try {
      for (let i = 0; i < ok.length; i += 400) {
        const batch = writeBatch(db);
        if (i === 0) batch.set(refCont(), pl.loc, { merge: true });
        ok.slice(i, i + 400).forEach(x => batch.set(doc(colEquipos(), x.e.id), { codigo: x.nuevo, codigoAnterior: x.e.codigo, actualizado: serverTimestamp(), actualizadoPor: nombreUsuario() }, { merge: true }));
        await batch.commit();
      }
      Object.entries(pl.loc).forEach(([k, n]) => CONT[k] = Math.max(+CONT[k] || 0, n));

}

// Resuelve el tipo de una fila importada: del catálogo, o tipo nuevo con sigla sugerida (única dentro del lote)
function resolverTipo(nombre, nuevos) {
  if (!nombre) return null;
  const t = tipoPorNombre(nombre);
  if (t) return { nombre: t.nombre, sigla: t.sigla, nuevo: false };
  const k = norm(nombre);
  if (!nuevos.has(k)) nuevos.set(k, { nombre, sigla: siglaSugerida(nombre, [...nuevos.values()].map(x => x.sigla)) });
  const n = nuevos.get(k);
  return { nombre: n.nombre, sigla: n.sigla, nuevo: true };
}
// Reconoce el tipo por la descripción (el nombre de tipo más largo contenido en ella)
const tipoPorDescripcion = (txt) => { const d = norm(txt); return [...TIPOS].sort((a, b) => b.nombre.length - a.nombre.length).find(t => (' ' + d + ' ').includes(' ' + norm(t.nombre) + ' ') || d.startsWith(norm(t.nombre))) || null; };

let xlsxCarga = null;
function XLSXlib() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxCarga) xlsxCarga = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(window.XLSX); s.onerror = () => { xlsxCarga = null; rej(new Error('No se pudo cargar el lector de Excel. Revise la conexión.')); };
    document.head.appendChild(s);
  });
  return xlsxCarga;
}

const filaExcel = (e) => [e.codigo, e.descripcion, sisNom(e.sistema), e.ubicacion || '', e.tipo || '', e.marca || '', e.modelo || '', e.serie || '', e.potencia || '', e.criticidad || '', (ESTADOS_EQUIPO.find(s => s.id === (e.estado || 'operativo')) || {}).label, e.notas || '', ...MOTOR.map(([k]) => e[k] || '')];

function leerSistema(v) {
  const t = norm(v);
  if (!t) return null;
  if (/^\d+$/.test(t)) return sistemaPorId(Number(t))?.id ?? null;
  const s = SISTEMAS.find(x => norm(x.nombre) === t || norm(x.corto) === t)
    || SISTEMAS.find(x => norm(x.nombre).startsWith(t) || t.startsWith(norm(x.nombre)))
    || (t.includes('osmosis') ? SISTEMAS[3] : t.includes('hielo') ? SISTEMAS[4] : t.includes('caldero') ? SISTEMAS[2] : t.includes('refrig') ? SISTEMAS[1] : t.includes('congel') ? SISTEMAS[5] : t.includes('electr') ? SISTEMAS[6] : t.includes('infra') ? SISTEMAS[7] : null);
  return s ? s.id : null;
}
function leerEstado(v) {
  const t = norm(v);
  if (!t || t.startsWith('oper')) return 'operativo';
  if (t.includes('fuera') || t.includes('parad')) return 'fuera';
  if (t.includes('baja')) return 'baja';
  return null;
}

async function leerExcel(file, box) {
  box.innerHTML = '<div class="glass" style="padding:28px;display:flex;justify-content:center"><div class="spinner"></div></div>';
  try {
    const X = await XLSXlib();
    const wb = X.read(await file.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets['Equipos'] || wb.Sheets[wb.SheetNames[0]];
    const filas = X.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
    const hi = filas.findIndex(r => r.some(c => norm(c) === 'codigo'));
    if (hi < 0) throw new Error('No se encontró la fila de encabezados (debe tener una columna "Código").');
    const cab = filas[hi].map(norm);
    const idx = {};
    COLS.forEach(([k, l]) => { const i = cab.indexOf(norm(l)); if (i >= 0) idx[k] = i; });
    if (idx.serie == null) { const i = cab.findIndex(c => c.includes('serie')); if (i >= 0) idx.serie = i; }
    const datos = filas.slice(hi + 1).filter(r => r.some(c => String(c).trim()));
    const vistos = new Set(), nuevosT = new Map(), nuevasU = new Map(), pl = planificador();
    const items = datos.map((r, n) => {
      const g = (k) => idx[k] == null ? '' : String(r[idx[k]] ?? '').trim();
      const d = { codigo: g('codigo').toUpperCase(), descripcion: g('descripcion'), sistemaTxt: g('sistema'), ubicacion: g('ubicacion'), tipo: g('tipo'), marca: g('marca'), modelo: g('modelo'), serie: g('serie'), potencia: g('potencia'), criticidad: g('criticidad').slice(0, 1).toUpperCase(), estadoTxt: g('estado'), notas: g('notas'), ...Object.fromEntries(MOTOR.map(([k]) => [k, g(k)])) };
      const errs = [];
      const ex = d.codigo ? EQ.find(e => norm(e.codigo) === norm(d.codigo)) : null;
      if (d.codigo && !ex) errs.push(`el código ${d.codigo} no existe (para un equipo nuevo deje el código vacío)`);
      if (!d.descripcion && !ex) errs.push('sin descripción');
      if (!d.tipo && !ex) errs.push('sin tipo');
      d.sistema = leerSistema(d.sistemaTxt);
      if (d.sistema === null && !(ex && !d.sistemaTxt)) errs.push(d.sistemaTxt ? `sistema "${d.sistemaTxt}" no reconocido` : 'sin sistema');
      d.estado = leerEstado(d.estadoTxt);
      if (d.estado === null) errs.push(`estado "${d.estadoTxt}" no reconocido`);
      if (d.criticidad && !['A', 'B', 'C'].includes(d.criticidad)) errs.push('criticidad debe ser A, B o C');
      if (d.codigo && vistos.has(norm(d.codigo))) errs.push('código repetido en el archivo');
      if (d.codigo) vistos.add(norm(d.codigo));
      if (d.ubicacion) {
        const ya = ubicPorNombre(d.ubicacion) || [...nuevasU.values()].find(u => norm(u) === norm(d.ubicacion));
        if (ya) d.ubicacion = ya;
        else { const par = ubicParecida(d.ubicacion, [...UBIC, ...nuevasU.values()]); if (par) errs.push(`ubicación "${d.ubicacion}" se parece a "${par}": corrija el archivo o créela antes en Ubicaciones`); else { nuevasU.set(norm(d.ubicacion), d.ubicacion); d.ubicNueva = true; } }
      }
      const tr = resolverTipo(d.tipo, nuevosT);
      if (tr) { d.tipo = tr.nombre; if (tr.nuevo) d.tipoNuevo = { nombre: tr.nombre, sigla: tr.sigla }; if (tr.nuevo && !siglaValida(tr.sigla)) errs.push('no se pudo generar la sigla del tipo'); }
      if (!ex && !errs.length) d.codigo = pl.sig(prefijo(d.sistema, tr.sigla));
      return { fila: hi + n + 2, d, ex, errs };
    });
    previa(box, items, 'excel', pl, nuevosT);
  } catch (e) { box.innerHTML = `<div class="alert err">${esc(e.message)}</div>`; }
}

async function desdeCostos(box) {
  box.innerHTML = '<div class="glass" style="padding:28px;display:flex;justify-content:center"><div class="spinner"></div></div>';
  try {
    const meta = await getDoc(doc(db, 'datos', 'cost', 'fuente', 'meta'));
    if (!meta.exists()) throw new Error('El aplicativo Costos todavía no tiene datos cargados.');
    let cat = JSON.parse(meta.data().cat || '[]');
    const est = await getDoc(doc(db, 'datos', 'cost', 'estado', 'principal'));
    if (est.exists() && est.data().json) {
      const st = JSON.parse(est.data().json);
      cat = cat.concat(st.catNew || []).map(c => ({ ...c, ...((st.catEdit || {})[c.id] || {}) }));
    }
    const AREA = { 'congelado': 5, 'planta de hielo': 4, 'planta de osmosis': 3, 'calderos': 2, 'resto de planta': 0 };
    const pl = planificador(), nuevosT = new Map();
    const items = cat.filter(c => c.n && norm(c.a) !== 'sin asignar').map((c, i) => {
      const sistema = AREA[norm(c.a)] ?? 0;
      const ex = EQ.find(e => e.origenCosto === c.id) || EQ.find(e => Number(e.sistema) === sistema && norm(e.descripcion) === norm(c.n));
      const tipoTxt = c.tp && norm(c.tp) !== 'equipo' ? c.tp : (tipoPorDescripcion(c.n)?.nombre || '');
      const d = { codigo: ex ? ex.codigo : '', descripcion: c.n, sistema, sistemaTxt: sisNom(sistema), ubicacion: '', tipo: tipoTxt, marca: '', modelo: '', serie: '', potencia: '', criticidad: '', estado: 'operativo', notas: '', origenCosto: c.id };
      const errs = [];
      if (!ex) {
        const tr = resolverTipo(d.tipo, nuevosT);
        if (!tr) errs.push('no se reconoce el tipo por la descripción: regístrelo uno por uno o por Excel');
        else { d.tipo = tr.nombre; if (tr.nuevo) d.tipoNuevo = { nombre: tr.nombre, sigla: tr.sigla }; d.codigo = pl.sig(prefijo(sistema, tr.sigla)); }
      }
      return { fila: i + 1, d, ex, errs, omitir: !!ex };
    });
    if (!items.length) throw new Error('El catálogo de Costos no tiene equipos.');
    previa(box, items, 'costos', pl, nuevosT);
  } catch (e) { box.innerHTML = `<div class="alert err">${esc(e.code === 'permission-denied' ? 'Su usuario no tiene acceso de lectura al aplicativo Costos.' : e.message)}</div>`; }
}

function previa(box, items, origen, pl, nuevosT) {
  const ok = items.filter(x => !x.errs.length && !x.omitir);
  const nuevos = ok.filter(x => !x.ex).length, act = ok.length - nuevos;
  const errs = items.filter(x => x.errs.length).length, omit = items.filter(x => x.omitir).length;
  box.innerHTML = `<div class="panel rise">
    <h3>${origen === 'costos' ? 'Catálogo de Costos' : 'Revisión del archivo'}</h3>
    <div class="resumen">
      <span><span class="st n">${nuevos}</span> nuevos</span>
      ${origen === 'excel' ? `<span><span class="st u">${act}</span> se actualizan</span>` : ''}
      ${omit ? `<span><span class="st o">${omit}</span> ya importados</span>` : ''}
      ${errs ? `<span><span class="st e">${errs}</span> con error (no se importan)</span>` : ''}
    </div>
    <div class="prev"><table>
      <thead><tr><th>${origen === 'costos' ? 'N°' : 'Fila'}</th><th>Resultado</th><th>Código</th><th>Descripción</th><th>Sistema</th><th>Ubicación</th><th>Tipo</th></tr></thead>
      <tbody>${items.map(x => `<tr>
        <td class="mono" style="color:var(--tx-3)">${x.fila}</td>
        <td>${x.errs.length ? `<span class="st e">Error</span><div style="font-size:12px;color:#FFB3B3;margin-top:4px">${esc(x.errs.join('; '))}</div>` : x.omitir ? '<span class="st o">Ya existe</span>' : x.ex ? '<span class="st u">Actualiza</span>' : '<span class="st n">Nuevo</span>'}</td>
        <td class="mono">${esc(x.d.codigo)}</td><td>${esc(x.d.descripcion || x.ex?.descripcion || '')}</td><td>${esc(x.d.sistema != null ? sisNom(x.d.sistema) : x.d.sistemaTxt)}</td><td>${esc(x.d.ubicacion)}${x.d.ubicNueva && !x.errs.length ? ' <span class="st u" title="Se agrega a la lista de ubicaciones">nueva</span>' : ''}</td><td>${esc(x.d.tipo)}${x.d.tipoNuevo && !x.errs.length ? ` <span class="st u" title="Tipo nuevo: se agrega al catálogo">nuevo · ${esc(x.d.tipoNuevo.sigla)}</span>` : ''}</td>
      </tr>`).join('')}</tbody></table></div>
    ${[...nuevosT.values()].length ? `<p class="hint" style="margin-top:10px">Los tipos marcados "nuevo" se agregan al catálogo con la sigla indicada. Si prefiere otra sigla, créelo antes en Tipos de equipo y vuelva a revisar.</p>` : ''}
    <div class="acciones" style="margin-top:16px;justify-content:flex-end">
      <button class="btn" id="pCan">Cancelar</button>
      <button class="btn btn-primary" id="pOk" ${ok.length ? '' : 'disabled'}>Importar ${ok.length} equipo${ok.length === 1 ? '' : 's'}</button>
    </div>
  </div>`;
  box.querySelector('#pCan').onclick = () => { box.innerHTML = ''; };
  box.querySelector('#pOk').onclick = async (ev) => {
    const b = ev.currentTarget; b.disabled = true; b.textContent = 'Importando…';
    // misma forma escrita para ubicación, tipo y marca (sin duplicar por tildes o mayúsculas)
    const canon = {};
    ['ubicacion', 'marca'].forEach(k => { canon[k] = new Map(valoresDe(EQ, k).map(v => [norm(v), v])); });
    const ubicDespues = [...UBIC, ...ok.filter(x => x.d.ubicNueva).map(x => x.d.ubicacion)].filter((u, i, a) => a.findIndex(z => norm(z) === norm(u)) === i);
    const usados = new Set(ok.map(x => x.d.tipoNuevo && norm(x.d.tipoNuevo.nombre)).filter(Boolean));
    const tiposDespues = [...TIPOS, ...[...nuevosT.values()].filter(t => usados.has(norm(t.nombre)))];
    const forma = (k, v) => { if (!v) return v; const n = norm(v); if (!canon[k].has(n)) canon[k].set(n, v); return canon[k].get(n); };
    try {
      for (let i = 0; i < ok.length; i += 400) {
        const batch = writeBatch(db);
        if (i === 0) {
          batch.set(refCont(), pl.loc, { merge: true });
          if (tiposDespues.length > TIPOS.length) batch.set(refTipos(), { lista: tiposDespues });
          if (ubicDespues.length > UBIC.length) batch.set(refUbic(), { lista: ubicDespues });
        }
        ok.slice(i, i + 400).forEach(x => {
          const d = {};
          ['codigo', 'descripcion', 'sistema', 'ubicacion', 'tipo', 'marca', 'modelo', 'serie', 'potencia', 'criticidad', 'notas', 'origenCosto', ...MOTOR.map(([k]) => k)].forEach(k => { if (x.d[k] !== '' && x.d[k] != null) d[k] = x.d[k]; });
          if (x.d.estadoTxt || !x.ex) d.estado = x.d.estado || 'operativo';
          ['ubicacion', 'marca'].forEach(k => { if (d[k]) d[k] = forma(k, d[k]); });
          const ref = x.ex ? doc(colEquipos(), x.ex.id) : doc(colEquipos());
          batch.set(ref, { ...d, ...(x.ex ? {} : { creado: serverTimestamp() }), actualizado: serverTimestamp(), actualizadoPor: nombreUsuario() }, { merge: true });
        });
        await batch.commit();
      }
      Object.entries(pl.loc).forEach(([k, n]) => CONT[k] = Math.max(+CONT[k] || 0, n));
      TIPOS = tiposDespues; UBIC = ubicDespues;
      EQ = await listarEquipos();
      toast(`${ok.length} equipos importados.`);
      box.innerHTML = `<div class="alert ok">Importación completada: ${nuevos} nuevos${act ? `, ${act} actualizados` : ''}. <a href="#equipos">Ver la base de equipos</a></div>`;
      const exp = document.querySelector('#cExp'); if (exp) { exp.disabled = false; exp.innerHTML = `${IC.xls}Exportar ${EQ.length} equipos`; }
    } catch (e) { toast('No se pudo importar: ' + (e.code || e.message), 'err'); b.disabled = false; b.textContent = `Importar ${ok.length} equipos`; }
  };
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// =====================================================================
// TIPOS DE EQUIPO (catálogo de siglas para la codificación)
// =====================================================================
function vistaTipos(main) {
  const cuenta = (t) => EQ.filter(e => norm(e.tipo) === norm(t.nombre)).length;
  const sinSigla = valoresDe(EQ, 'tipo').filter(x => !tipoPorNombre(x));
  main.innerHTML = `
    <div class="pagehead">
      <div><div class="eyebrow rise">Equipos</div><h1 class="h-display rise d1">Tipos de equipo</h1></div>
      <div class="acciones rise d2">${puede() ? `<button class="btn btn-primary" id="tNuevo">${IC.mas}Nuevo tipo</button>` : ''}</div>
    </div>
    <div class="panel rise d2" style="margin-bottom:18px">
      <p style="margin:0">Código del equipo: <b class="mono" style="color:var(--mint-2)">SISTEMA-SIGLA-N°</b>, por ejemplo <span class="mono">REF-CMP-01</span>.
      Prefijos de sistema: ${SISTEMAS.map(x => `<span class="mono">${x.corto}</span> ${esc(x.nombre)}`).join(' · ')}.
      La sigla de un tipo ya usado en códigos no se puede cambiar.</p>
    </div>
    ${sinSigla.length ? `<div class="alert warn rise d2" style="margin-bottom:18px">${sinSigla.length} tipo${sinSigla.length === 1 ? '' : 's'} en uso sin sigla: ${sinSigla.map(esc).join(', ')}. Asígneles una sigla para poder codificar esos equipos.</div>` : ''}
    <div class="lista rise d3" style="overflow-x:auto"><table class="tabla">
      <thead><tr><th>Tipo</th><th>Sigla</th><th>Equipos</th><th></th></tr></thead>
      <tbody>
        ${sinSigla.map(x => `<tr class="sin"><td>${esc(x)}</td><td>sin sigla</td><td>${EQ.filter(e => norm(e.tipo) === norm(x)).length}</td><td style="text-align:right">${puede() ? `<button class="btn sm" data-sin="${esc(x)}">Asignar sigla</button>` : ''}</td></tr>`).join('')}
        ${listaTipos().map(t => `<tr><td>${esc(t.nombre)}</td><td class="mono">${esc(t.sigla)}</td><td>${cuenta(t) || '<span style="color:var(--tx-3)">0</span>'}</td><td style="text-align:right">${puede() ? `<button class="btn sm" data-t="${esc(t.sigla)}">Editar</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div>`;
  const $ = (q) => main.querySelector(q);
  if ($('#tNuevo')) $('#tNuevo').onclick = () => editarTipo(null);
  main.querySelectorAll('[data-t]').forEach(b => b.onclick = () => editarTipo(TIPOS.find(t => t.sigla === b.dataset.t)));
  main.querySelectorAll('[data-sin]').forEach(b => b.onclick = () => editarTipo(null, b.dataset.sin));
}

function editarTipo(t, nombreIni = '') {
  const fija = t ? usaSigla(t.sigla) : false;
  const n = t ? EQ.filter(e => norm(e.tipo) === norm(t.nombre)).length : 0;
  const m = modal({
    titulo: t ? 'Editar tipo' : 'Nuevo tipo de equipo', ancho: 520,
    cuerpo: `<div class="g2">
      <div style="grid-column:1/-1"><label class="label" for="tNom">Nombre</label><input class="field" id="tNom" value="${esc(t ? t.nombre : nombreIni)}" placeholder="Compresor" ${nombreIni ? 'readonly' : ''}></div>
      <div><label class="label" for="tSig">Sigla (2 a 4 letras)</label><input class="field mono" id="tSig" maxlength="4" value="${esc(t ? t.sigla : siglaSugerida(nombreIni))}" ${fija ? 'disabled' : ''} style="text-transform:uppercase"></div>
      <div class="hint" style="align-self:end;padding-bottom:12px">${fija ? 'Ya se usa en códigos asignados.' : 'Se usará en los códigos nuevos.'}</div>
      ${t && n ? `<div class="hint" style="grid-column:1/-1">Si cambia el nombre, se actualiza en los ${n} equipo${n === 1 ? '' : 's'} de este tipo.</div>` : ''}
    </div>`,
    pie: `${t && !n && !fija && CTX.rol === 'admin' ? '<button type="button" class="btn btn-danger" id="tDel" style="margin-right:auto">Eliminar</button>' : ''}<button type="button" class="btn" data-x>Cancelar</button><button type="submit" class="btn btn-primary" id="tOk">Guardar</button>`
  });
  const sig = m.$('#tSig');
  let editada = !!t;
  sig.oninput = () => { editada = true; sig.value = sig.value.toUpperCase().replace(/[^A-Z]/g, ''); };
  m.$('#tNom').oninput = () => { if (!editada) sig.value = siglaSugerida(m.$('#tNom').value); };
  setTimeout(() => (nombreIni ? sig : m.$('#tNom')).focus(), 50);
  if (m.$('#tDel')) m.$('#tDel').onclick = async () => {
    try { const l = TIPOS.filter(x => x !== t); await writeBatch(db).set(refTipos(), { lista: l }).commit(); TIPOS = l; m.cerrar(); toast('Tipo eliminado.'); render(); }
    catch (e) { m.err('No se pudo eliminar: ' + (e.code || e.message)); }
  };
  m.form.onsubmit = async (ev) => {
    ev.preventDefault(); m.err('');
    const nombre = m.$('#tNom').value.trim(), sigla = sig.value.trim().toUpperCase();
    if (!nombre) return m.err('Ingrese el nombre.');
    if (TIPOS.some(x => x !== t && norm(x.nombre) === norm(nombre))) return m.err('Ese tipo ya existe.');
    if (!siglaValida(sigla)) return m.err('La sigla debe tener de 2 a 4 letras.');
    if (!siglaLibre(sigla, t)) return m.err(`La sigla ${sigla} ya corresponde a "${TIPOS.find(x => x.sigla === sigla).nombre}".`);
    if ((!t || t.sigla !== sigla) && usaSigla(sigla)) return m.err(`La sigla ${sigla} ya aparece en códigos asignados. Elija otra.`);
    const b = m.$('#tOk'); b.disabled = true; b.textContent = 'Guardando…';
    try {
      const nuevoT = { nombre, sigla };
      const lista = t ? TIPOS.map(x => x === t ? nuevoT : x) : [...TIPOS, nuevoT];
      const antes = t ? t.nombre : nombreIni;
      const afect = antes && antes !== nombre ? EQ.filter(e => norm(e.tipo) === norm(antes)) : [];
      for (let i = 0; i < Math.max(afect.length, 1); i += 400) {
        const batch = writeBatch(db);
        if (i === 0) batch.set(refTipos(), { lista });
        afect.slice(i, i + 400).forEach(e => batch.set(doc(colEquipos(), e.id), { tipo: nombre, actualizado: serverTimestamp(), actualizadoPor: nombreUsuario() }, { merge: true }));
        await batch.commit();
      }
      afect.forEach(e => e.tipo = nombre);
      TIPOS = lista;
      m.cerrar(); toast('Tipo guardado.'); render();
    } catch (e) { m.err('No se pudo guardar: ' + (e.code || e.message)); b.disabled = false; b.textContent = 'Guardar'; }
  };
}

// =====================================================================
// UBICACIONES (lista controlada)
// =====================================================================
function vistaUbicaciones(main) {
  const cuenta = (u) => EQ.filter(e => norm(e.ubicacion) === norm(u)).length;
  const fuera = valoresDe(EQ, 'ubicacion').filter(x => !ubicPorNombre(x));
  main.innerHTML = `
    <div class="pagehead">
      <div><div class="eyebrow rise">Equipos</div><h1 class="h-display rise d1">Ubicaciones</h1></div>
      <div class="acciones rise d2">${puede() ? `<button class="btn btn-primary" id="uNueva">${IC.mas}Nueva ubicación</button>` : ''}</div>
    </div>
    <div class="panel rise d2" style="margin-bottom:18px"><p style="margin:0">Lugar físico donde está el equipo. En la ficha se elige de esta lista; desde ahí también se pueden agregar ubicaciones nuevas.
      Si renombra una, se actualiza en todos sus equipos. Para corregir duplicados, use <b>Unificar</b>.</p></div>
    ${fuera.length ? `<div class="alert warn rise d2" style="margin-bottom:18px">${fuera.length === 1 ? 'Hay 1 ubicación en uso fuera de la lista: agréguela o unifíquela' : `Hay ${fuera.length} ubicaciones en uso fuera de la lista: agréguelas o unifíquelas`} con una existente.</div>` : ''}
    <div class="lista rise d3" style="overflow-x:auto"><table class="tabla">
      <thead><tr><th>Ubicación</th><th>Equipos</th><th></th></tr></thead>
      <tbody>
        ${fuera.map(x => `<tr class="sin"><td>${esc(x)} · fuera de la lista</td><td>${cuenta(x)}</td><td style="text-align:right;white-space:nowrap">${puede() ? `<button class="btn sm" data-add="${esc(x)}">Agregar</button> <button class="btn sm" data-uni="${esc(x)}">Unificar</button>` : ''}</td></tr>`).join('')}
        ${listaUbic().map(u => `<tr><td>${esc(u)}</td><td>${cuenta(u) || '<span style="color:var(--tx-3)">0</span>'}</td><td style="text-align:right;white-space:nowrap">${puede() ? `<button class="btn sm" data-ed="${esc(u)}">Editar</button> <button class="btn sm" data-uni="${esc(u)}">Unificar</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Aún no hay ubicaciones.</td></tr>'}
      </tbody></table></div>`;
  const $ = (q) => main.querySelector(q);
  if ($('#uNueva')) $('#uNueva').onclick = () => editarUbic(null);
  main.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => editarUbic(b.dataset.ed));
  main.querySelectorAll('[data-uni]').forEach(b => b.onclick = () => unificarUbic(b.dataset.uni));
  main.querySelectorAll('[data-add]').forEach(b => b.onclick = async () => {
    try { const l = [...UBIC, b.dataset.add]; await writeBatch(db).set(refUbic(), { lista: l }).commit(); UBIC = l; toast('Ubicación agregada.'); render(); }
    catch (e) { toast('No se pudo agregar: ' + (e.code || e.message), 'err'); }
  });
}

// cambia la ubicación de los equipos (renombrar o unificar) y guarda la lista
async function aplicarUbic(lista, de, a) {
  const afect = de && a && de !== a ? EQ.filter(e => norm(e.ubicacion) === norm(de) && e.ubicacion !== a) : [];
  for (let i = 0; i < Math.max(afect.length, 1); i += 400) {
    const batch = writeBatch(db);
    if (i === 0) batch.set(refUbic(), { lista });
    afect.slice(i, i + 400).forEach(e => batch.set(doc(colEquipos(), e.id), { ubicacion: a, actualizado: serverTimestamp(), actualizadoPor: nombreUsuario() }, { merge: true }));
    await batch.commit();
  }
  afect.forEach(e => e.ubicacion = a);
  UBIC = lista;
  return afect.length;
}

function editarUbic(u) {
  const n = u ? EQ.filter(e => norm(e.ubicacion) === norm(u)).length : 0;
  const m = modal({
    titulo: u ? 'Editar ubicación' : 'Nueva ubicación', ancho: 520,
    cuerpo: `<label class="label" for="uNom">Nombre</label><input class="field" id="uNom" value="${esc(u || '')}" placeholder="Captación de agua de mar" autocomplete="off">
      <div class="hint">${u && n ? `Se actualiza en los ${n} equipo${n === 1 ? '' : 's'} de esta ubicación. Si algún formato filtra por ella, actualícelo en Plantillas.` : ''}</div>`,
    pie: `${u && !n && CTX.rol === 'admin' ? '<button type="button" class="btn btn-danger" id="uDel" style="margin-right:auto">Eliminar</button>' : ''}<button type="button" class="btn" data-x>Cancelar</button><button type="submit" class="btn btn-primary" id="uOk">Guardar</button>`
  });
  setTimeout(() => m.$('#uNom').focus(), 50);
  if (m.$('#uDel')) m.$('#uDel').onclick = async () => {
    try { await aplicarUbic(UBIC.filter(x => x !== u), null, null); m.cerrar(); toast('Ubicación eliminada.'); render(); }
    catch (e) { m.err('No se pudo eliminar: ' + (e.code || e.message)); }
  };
  let avisado = false;
  m.$('#uNom').oninput = () => { avisado = false; };
  m.form.onsubmit = async (ev) => {
    ev.preventDefault(); m.err('');
    const nombre = m.$('#uNom').value.trim().replace(/\s+/g, ' ');
    if (!nombre) return m.err('Ingrese el nombre.');
    if (UBIC.some(x => x !== u && norm(x) === norm(nombre))) return m.err('Esa ubicación ya existe. Para juntar dos ubicaciones use Unificar.');
    const par = ubicParecida(nombre, UBIC.filter(x => x !== u));
    if (par && !avisado) { avisado = true; return m.err(`Se parece a "${par}". Si es otra ubicación, vuelva a pulsar Guardar.`); }
    const b = m.$('#uOk'); b.disabled = true; b.textContent = 'Guardando…';
    try {
      const lista = u ? UBIC.map(x => x === u ? nombre : x) : [...UBIC, nombre];
      await aplicarUbic(lista, u, nombre);
      m.cerrar(); toast('Ubicación guardada.'); render();
    } catch (e) { m.err('No se pudo guardar: ' + (e.code || e.message)); b.disabled = false; b.textContent = 'Guardar'; }
  };
}

function unificarUbic(u) {
  const n = EQ.filter(e => norm(e.ubicacion) === norm(u)).length;
  const otras = listaUbic().filter(x => norm(x) !== norm(u));
  if (!otras.length) return toast('No hay otra ubicación con cuál unificar.', 'err');
  const sug = ubicParecida(u, otras);
  const m = modal({
    titulo: 'Unificar ubicación', ancho: 560,
    cuerpo: `<p style="margin:0 0 14px;color:var(--tx-2);line-height:1.55">${n ? `Los ${n} equipo${n === 1 ? '' : 's'} de <b>${esc(u)}</b> pasan a la ubicación elegida` : `<b>${esc(u)}</b> no tiene equipos`} y <b>${esc(u)}</b> se retira de la lista.</p>
      <label class="label" for="uDest">Pasar a</label><select class="field" id="uDest">${otras.map(x => `<option value="${esc(x)}" ${x === sug ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>`,
    pie: `<button type="button" class="btn" data-x>Cancelar</button><button type="submit" class="btn btn-primary" id="uOk">Unificar</button>`
  });
  m.form.onsubmit = async (ev) => {
    ev.preventDefault();
    const a = m.$('#uDest').value, b = m.$('#uOk'); b.disabled = true; b.textContent = 'Unificando…';
    try { const k = await aplicarUbic(UBIC.filter(x => norm(x) !== norm(u)), u, a); m.cerrar(); toast(`${k} equipo${k === 1 ? '' : 's'} pasaron a ${a}.`); render(); }
    catch (e) { m.err('No se pudo unificar: ' + (e.code || e.message)); b.disabled = false; b.textContent = 'Unificar'; }
  };
}

// =====================================================================
function render() {
  if (!CTX) return;
  CTX.main.innerHTML = '';
  if (CTX.modulo === 'carga') vistaCarga(CTX.main);
  else if (CTX.modulo === 'tipos') vistaTipos(CTX.main);
  else if (CTX.modulo === 'ubicaciones') vistaUbicaciones(CTX.main);
  else vistaBase(CTX.main);
}

let listo = false;
CTX = await iniciarApp({
  appId: 'eq',
  alCambiarModulo: (mod, ctx) => {
    CTX = ctx;
    if (!listo) { ctx.main.innerHTML = '<div style="display:flex;justify-content:center;padding:80px 0"><div class="spinner"></div></div>'; return; }
    render();
  }
});
await cargarCodificacion();
try { EQ = await listarEquipos(); } catch (e) { toast('No se pudo leer la base de equipos: ' + (e.code || e.message), 'err'); }
if (!UBIC) UBIC = valoresDe(EQ, 'ubicacion'); // primera vez: parte de las ubicaciones ya usadas
listo = true;
render();
</script>
