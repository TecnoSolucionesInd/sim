<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informes técnicos · SIM</title>
<link rel="stylesheet" href="../../core/sim.css">
<style>
  .pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
  .pagehead h1{font-size:38px;margin-top:12px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
  .kpi{padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);animation:rise .7s var(--ease) both}
  .kpi b{display:block;font-family:var(--f-display);font-size:28px;font-weight:600}
  .kpi span{font-size:12.5px;color:var(--tx-3)}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .tools .field{height:42px;font-size:14px;width:auto}
  .tbl-wrap{overflow-x:auto}
  .rowbtn{cursor:pointer}
  .cod{font-family:var(--f-mono);font-size:12.5px;color:var(--tx-2);white-space:nowrap}
  .ttl{font-weight:500}
  .sub{font-size:12.5px;color:var(--tx-3);margin-top:2px}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
  .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .fic{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px}
  .side h4{font-family:var(--f-display);font-size:14px;font-weight:600;margin:0 0 10px;color:var(--tx)}
  .box{padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);margin-bottom:14px}
  .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13.5px}
  .it:last-child{border-bottom:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip2{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12.5px}
  .chip2 button{background:none;border:0;color:var(--tx-3);padding:0;font-size:14px;line-height:1}
  .tl{position:relative;padding-left:18px}
  .tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:rgba(255,255,255,.1)}
  .tl .e{position:relative;padding:4px 0 12px;font-size:13px}
  .tl .e::before{content:"";position:absolute;left:-17px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--c,#8b9bb0)}
  .drop{display:block;padding:26px 18px;border-radius:16px;border:1.5px dashed rgba(255,255,255,.25);background:rgba(255,255,255,.04);text-align:center;cursor:pointer;transition:border-color .25s,background .25s}
  .drop:hover,.drop.over{border-color:var(--mint);background:rgba(111,227,207,.06)}
  .meter{height:14px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin:14px 0 8px}
  .meter div{height:100%;border-radius:999px;transition:width .6s var(--ease)}
  .viewer{position:fixed;inset:0;z-index:70;background:rgba(20,26,34,.92);display:flex;flex-direction:column;animation:fadein .25s ease both}
  .viewer header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
  .viewer iframe{flex:1;border:0;background:#fff;width:100%}
  .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}
  .bar div{height:100%;width:0;background:var(--mint);transition:width .2s}
  @media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.fic,.g2{grid-template-columns:minmax(0,1fr)}.pagehead h1{font-size:30px}}
</style>
</head>
<body>
<script type="module">
import { iniciarApp, toast, db, RAIZ } from '../../core/core.js';
import { listarEquipos, etiquetaEquipo } from '../../core/equipos.js';
import { LIMITE_STORAGE, UMBRAL_AVISO, UMBRAL_CRITICO, MAX_ARCHIVO, ESTADOS_INF, TIPOS_INF, AREAS_INF, PEDIDOS, fmtBytes } from '../../core/informes.js';
import {
  collection, doc, getDoc, getDocs, setDoc, updateDoc, onSnapshot, runTransaction, serverTimestamp, increment, arrayUnion
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { guardarArchivo, leerArchivo, borrarArchivo, descargarBlob } from '../../core/archivos.js';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PREFIJO = 'IPSMSA/MMTO/INF';
const MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'setiembre', 'octubre', 'noviembre', 'diciembre'];
const colInf = () => collection(db, 'datos', 'inf', 'informes');
const docUso = () => doc(db, 'datos', 'inf', 'config', 'uso');
const docContactos = () => doc(db, 'datos', 'inf', 'config', 'contactos');
const hoyISO = () => new Date().toISOString().slice(0, 10);
const ahora = () => new Date().toISOString();
const fmtF = (iso) => iso ? new Date(iso.length <= 10 ? iso + 'T12:00:00' : iso).toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const money = (m, mon) => m || m === 0 ? `${mon || 'S/'} ${(+m).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` : '—';
const tipoLbl = (id) => (TIPOS_INF.find(t => t.id === id) || TIPOS_INF[TIPOS_INF.length - 1]).label;
const pill = (e) => { const s = ESTADOS_INF[e] || ESTADOS_INF.borrador; return `<span class="pill" style="background:${s.bg};color:${s.fg}">${s.label}</span>`; };

let CTX = null, L = [], USO = { bytes: 0 }, CONTACTOS = [], EQ = null, PROGS = null, FIL = { estado: 'all', tipo: 'all', q: '' };
const escribe = () => CTX.puedeEscribir;
const gestor = () => ['admin', 'supervisor'].includes(CTX.rol);
const quien = () => CTX.perfil?.nombre || CTX.user.email;

// ---------------- modal genérico ----------------
function modal({ titulo, cuerpo, pie, ancho = 760 }) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<form class="modal" novalidate style="max-width:${ancho}px"><div class="modal-h"><div style="font-family:var(--f-display);font-weight:600;font-size:20px;min-width:0">${titulo}</div>
    <button type="button" class="btn btn-icon" data-x aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="modal-b">${cuerpo}<div class="alert err" data-err style="margin-top:16px" hidden></div></div><div class="modal-f">${pie || ''}</div></form>`;
  document.body.appendChild(bg);
  const m = { bg, form: bg.querySelector('form'), $: (s) => bg.querySelector(s),
    cerrar: () => { bg.remove(); if (!document.querySelector('.modal-bg')) render(CTX.modulo); },
    err: (t) => { const e = bg.querySelector('[data-err]'); e.hidden = !t; e.textContent = t || ''; } };
  bg.querySelectorAll('[data-x]').forEach(b => b.onclick = m.cerrar);
  bg.addEventListener('mousedown', (e) => { if (e.target === bg) m.cerrar(); });
  return m;
}

// ---------------- almacenamiento ----------------
const fracUso = () => (+USO.bytes || 0) / LIMITE_STORAGE;
function avisoUso() {
  const f = fracUso();
  if (f < UMBRAL_AVISO || !gestor()) return '';
  const crit = f >= UMBRAL_CRITICO;
  return `<div class="alert ${crit ? 'err' : 'warn'} rise" style="margin-bottom:18px">Almacenamiento al ${(f * 100).toFixed(0)} % del espacio reservado para archivos (${fmtBytes(USO.bytes)} de ${fmtBytes(LIMITE_STORAGE)}).
    ${crit ? 'Retire archivos antiguos antes de seguir cargando: al llegar al límite no se podrán cargar más.' : 'Conviene empezar a descargar y retirar los archivos más antiguos.'}
    <a href="#almacenamiento" style="margin-left:6px">Ir a Almacenamiento</a></div>`;
}
const nombreSeguro = (n) => n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_').slice(-80);

async function subirArchivo(id, prefijo, file, onProg) {
  if (file.size > MAX_ARCHIVO) throw new Error(`El archivo supera ${fmtBytes(MAX_ARCHIVO)}.`);
  if ((+USO.bytes || 0) + file.size > LIMITE_STORAGE) throw new Error('Se alcanzó el espacio reservado para archivos. Retire archivos antiguos en Almacenamiento.');
  const a = await guardarArchivo('inf', file, { informe: id, uso: prefijo }, onProg);
  await setDoc(docUso(), { bytes: increment(file.size), archivos: increment(1), actualizado: serverTimestamp() }, { merge: true });
  return { ...a, fecha: ahora(), por: quien() };
}

async function verArchivo(a, titulo) {
  if (!a || a.retirado) { toast('El archivo fue retirado del SIM.', 'err'); return; }
  const v = document.createElement('div'); v.className = 'viewer';
  v.innerHTML = `<header><div style="flex:1;min-width:0"><div style="font-family:var(--f-display);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(titulo || a.nombre)}</div>
    <div class="sub">${esc(a.nombre)} · ${fmtBytes(a.bytes)}</div></div>
    <button class="btn" id="vDl" style="height:40px" disabled>Descargar</button>
    <button class="btn btn-icon" data-x aria-label="Cerrar">✕</button></header>
    <div id="vCuerpo" style="flex:1;display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div>`;
  document.body.appendChild(v);
  let url = null;
  v.querySelector('[data-x]').onclick = () => { v.remove(); if (url) URL.revokeObjectURL(url); };
  try {
    const blob = await leerArchivo('inf', a);
    url = URL.createObjectURL(blob);
    const esPDF = /pdf/.test(a.tipo) || /\.pdf$/i.test(a.nombre);
    if (esPDF) {
      // PDF dibujado página por página (también en celulares, donde el visor del navegador no se muestra dentro de la página)
      try { await mostrarPDF(blob, v.querySelector('#vCuerpo')); }
      catch { v.querySelector('#vCuerpo').outerHTML = `<iframe src="${url}" title="${esc(a.nombre)}"></iframe>`; }
    } else if (/html/.test(a.tipo)) {
      // HTML en iframe aislado (sin acceso a la sesión del SIM)
      v.querySelector('#vCuerpo').outerHTML = `<iframe sandbox="allow-scripts allow-popups allow-modals allow-downloads" src="${url}" title="${esc(a.nombre)}"></iframe>`;
    } else if (/^image\//.test(a.tipo)) {
      v.querySelector('#vCuerpo').innerHTML = `<img src="${url}" alt="${esc(a.nombre)}" style="max-width:96%;max-height:100%;object-fit:contain">`;
    } else {
      v.querySelector('#vCuerpo').innerHTML = '<div class="muted">Vista previa no disponible. Use "Descargar".</div>';
    }
    const dl = v.querySelector('#vDl'); dl.disabled = false; dl.onclick = () => descargarBlob(blob, a.nombre);
  } catch (e) { v.querySelector('#vCuerpo').innerHTML = `<div class="alert err">No se pudo abrir el archivo: ${esc(e.code || e.message)}</div>`; }
}

// ---------------- PDF (pdf.js, se carga solo cuando se necesita) ----------------
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let _pdfjs = null;
function pdfjs() {
  if (!_pdfjs) _pdfjs = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = PDFJS + 'pdf.min.js';
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; res(window.pdfjsLib); };
    sc.onerror = () => { _pdfjs = null; rej(new Error('No se pudo cargar el lector de PDF (revise la conexión).')); };
    document.head.appendChild(sc);
  });
  return _pdfjs;
}
// Texto de las primeras páginas como filas de celdas { x, t } (respeta columnas y palabras partidas), y el título
// (líneas con la letra más grande de la primera página).
async function textoPDF(buf, paginas = 3) {
  const lib = await pdfjs();
  const pdf = await lib.getDocument({ data: buf }).promise;
  const filasTodas = []; let titulo = '';
  for (let n = 1; n <= Math.min(paginas, pdf.numPages); n++) {
    const tc = await (await pdf.getPage(n)).getTextContent();
    const grupos = new Map();
    tc.items.forEach(it => {
      if (!it.str) return;
      const y = Math.round(it.transform[5] / 3) * 3, h = Math.abs(it.transform[3]) || Math.abs(it.transform[0]) || it.height || 8;
      if (!grupos.has(y)) grupos.set(y, []);
      grupos.get(y).push({ x: it.transform[4], w: it.width || 0, s: it.str, h });
    });
    const filas = [...grupos.entries()].sort((a, b) => b[0] - a[0]).map(([, its]) => {
      its.sort((a, b) => a.x - b.x);
      const celdas = []; let c = null, fin = -1e9, hmax = 0;
      its.forEach(it => {
        hmax = Math.max(hmax, it.h);
        const gap = it.x - fin;
        if (!c || gap > it.h * 2.2) { c = { x: it.x, t: it.s }; celdas.push(c); }        // columna nueva
        else c.t += (gap > it.h * 0.18 && !/\s$/.test(c.t) && !/^\s/.test(it.s) ? ' ' : '') + it.s;  // misma frase
        fin = it.x + it.w;
      });
      // caracteres de uso privado (glifos de la fuente sin equivalente, p. ej. guiones largos) → guion o nada
      celdas.forEach(k => k.t = k.t.replace(/\s[\uE000-\uF8FF]\s/g, ' — ').replace(/[\uE000-\uF8FF]/g, '').replace(/\s+/g, ' ').trim());
      return { celdas: celdas.filter(k => k.t), h: hmax };
    }).filter(f => f.celdas.length);
    if (n === 1 && filas.length) {
      const mayor = Math.max(...filas.map(f => f.h));
      const i0 = filas.findIndex(f => f.h >= mayor * 0.95);
      const tl = []; for (let i = i0; i < filas.length && filas[i].h >= mayor * 0.95; i++) tl.push(filas[i].celdas.map(k => k.t).join(' '));
      titulo = tl.join(' ');
    }
    filas.forEach(f => filasTodas.push(f.celdas));
  }
  if (!titulo || titulo.length < 6) {
    try { const t = (await pdf.getMetadata())?.info?.Title || ''; if (t.length > 6 && !/^untitled$|\.(docx?|pptx?|html?)$/i.test(t)) titulo = t.trim(); } catch {}
  }
  return { filas: filasTodas, titulo, paginas: pdf.numPages };
}
async function mostrarPDF(blob, cont) {
  const lib = await pdfjs();
  const pdf = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
  cont.innerHTML = '';
  cont.style.cssText = 'flex:1;overflow:auto;background:#525b66;padding:16px 0;display:block';
  const ancho = Math.min(cont.clientWidth - 24, 1100), dpr = Math.min(window.devicePixelRatio || 1, 2);
  for (let n = 1; n <= pdf.numPages; n++) {
    const pg = await pdf.getPage(n);
    const v1 = pg.getViewport({ scale: 1 }), esc1 = ancho / v1.width, vp = pg.getViewport({ scale: esc1 * dpr });
    const c = document.createElement('canvas');
    c.width = vp.width; c.height = vp.height;
    c.style.cssText = `display:block;width:${ancho}px;height:${vp.height / dpr}px;margin:0 auto 14px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35)`;
    cont.appendChild(c);
    await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  }
}

// ---------------- código correlativo ----------------
async function nuevoCodigo() {
  const aa = String(new Date().getFullYear()).slice(-2);
  return runTransaction(db, async (tx) => {
    const r = doc(db, 'datos', 'inf', 'config', 'contador');
    const s = await tx.get(r);
    const d = s.exists() ? s.data() : {};
    const n = d.anio === aa ? (+d.n || 0) + 1 : 1;
    tx.set(r, { anio: aa, n });
    return { codigo: `${PREFIJO}-${aa}-${String(n).padStart(3, '0')}`, anio: aa, n };
  });
}

// ---------------- autollenado desde el HTML del informe ----------------
function leerHTML(texto) {
  const d = new DOMParser().parseFromString(texto, 'text/html');
  d.querySelectorAll('script,style,noscript').forEach(x => x.remove());
  const textos = (el) => { const w = d.createTreeWalker(el, NodeFilter.SHOW_TEXT); const o = []; while (w.nextNode()) { const t = w.currentNode.nodeValue.replace(/\s+/g, ' ').trim(); if (t) o.push(t); } return o; };
  let titulo = (d.title || '').trim();
  const h1 = d.querySelector('h1'); if (h1) { const t = textos(h1).join(' ').replace(/\s+/g, ' ').trim(); if (t.length > 6) titulo = t; }
  return datosDeTexto((d.body ? textos(d.body) : []).map(t => [{ x: 0, t }]), titulo);
}
// Extrae los datos del informe a partir de filas de celdas { x, t } (HTML: una celda por fila; PDF: columnas)
const normEt = (t) => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[\s:]+/g, '').toUpperCase();
function datosDeTexto(filas, titulo) {
  const campo = (...ets) => {
    for (const et of ets) {
      const n = normEt(et), re = new RegExp('^' + et + '\\s*:\\s*(.+)$', 'i');
      for (let i = 0; i < filas.length; i++) for (const c of filas[i]) {
        if (normEt(c.t) === n) {
          // valor debajo de la etiqueta: celda de la fila siguiente más cercana en x
          const sig = filas[i + 1]; if (!sig) continue;
          return sig.reduce((b, k) => Math.abs(k.x - c.x) < Math.abs(b.x - c.x) ? k : b, sig[0]).t;
        }
        const m = c.t.match(re); if (m) return m[1].trim();
      }
    }
    return '';
  };
  const out = { titulo: (titulo || '').replace(/\s+/g, ' ').trim() };
  out.dirigido = campo('Dirigido a', 'Para', 'Atención', 'Atencion');
  const prov = campo('Proveedor', 'Contratista'); if (prov) out.proveedor = prov.split('·')[0].trim();
  const todo = filas.map(f => f.map(k => k.t).join(' ')).join(' ');
  const cot = (todo.match(/Cotizaci[oó]n\s*N\.?\s*[º°o]?\.?\s*([\w\-\/]+(?:[\s\-]20\d{2})?)/i) || [])[1]; if (cot) out.docs = ['Cot. ' + cot.replace(/\s+/, '-')];
  const iM = todo.search(/Monto (solicitado|total)|Total sin IGV|Presupuesto/i);
  const mm = (iM >= 0 ? todo.slice(iM) : todo).match(/(US\$|S\/\.?)\s?([\d.,]+)/);
  if (mm) { out.moneda = mm[1].startsWith('US') ? 'US$' : 'S/'; out.monto = +mm[2].replace(/,/g, ''); }
  const fd = todo.match(/(\d{1,2}) de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|se?tiembre|octubre|noviembre|diciembre),? (?:de |del )?(\d{4})/i);
  if (fd) { const m = MES.findIndex(x => x.startsWith(fd[2].toLowerCase().slice(0, 3))); out.fecha = `${fd[3]}-${String(m + 1).padStart(2, '0')}-${fd[1].padStart(2, '0')}`; }
  else { const f2 = todo.match(/\b(\d{2})\/(\d{2})\/(20\d{2})\b/); if (f2) out.fecha = `${f2[3]}-${f2[2]}-${f2[1]}`; }
  if (/solicitud de aprobaci[oó]n|se solicita la aprobaci[oó]n/i.test(todo)) out.tipo = 'solicitud';
  else if (/deslinde/i.test(todo)) out.tipo = 'deslinde';
  else if (/evaluaci[oó]n (t[eé]cnica|de propuestas)|comparativo/i.test(todo)) out.tipo = 'evaluacion';
  else if (/falla|aver[ií]a/i.test(out.titulo + ' ' + todo.slice(0, 400))) out.tipo = 'falla';
  if (!out.titulo) out.titulo = (filas.find(f => f.map(k => k.t).join(' ').length > 12) || []).map(k => k.t).join(' ');
  return out;
}

// ---------------- vista Informes ----------------
function vistaInformes(main) {
  const n = (e) => L.filter(x => x.estado === e).length;
  const pend = L.filter(x => x.estado === 'presentado');
  main.innerHTML = `
    <div class="pagehead"><div><div class="eyebrow rise">Informes técnicos</div><h1 class="h-display rise d1">Informes</h1></div>
      ${escribe() ? `<button class="btn btn-primary rise d2" id="bNuevo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nuevo informe</button>` : ''}</div>
    ${avisoUso()}
    <div class="kpis">
      <div class="kpi"><b>${L.length}</b><span>Informes registrados</span></div>
      <div class="kpi d1"><b style="color:#9ED6FA">${pend.length}</b><span>Presentados, en espera de respuesta</span></div>
      <div class="kpi d2"><b style="color:#8FF0DE">${n('aprobado')}</b><span>Aprobados</span></div>
      <div class="kpi d3"><b style="color:#FFCF73">${n('observado')}</b><span>Observados</span></div>
    </div>
    <div class="tools rise d2">
      <label class="sr" for="fQ">Buscar</label><input class="field" id="fQ" placeholder="Buscar por código, título, proveedor…" style="flex:1;min-width:220px" value="${esc(FIL.q)}">
      <label class="sr" for="fE">Estado</label><select class="field" id="fE"><option value="all">Todos los estados</option>${Object.entries(ESTADOS_INF).map(([k, v]) => `<option value="${k}" ${FIL.estado === k ? 'selected' : ''}>${v.label}</option>`).join('')}</select>
      <label class="sr" for="fT">Tipo</label><select class="field" id="fT"><option value="all">Todos los tipos</option>${TIPOS_INF.map(t => `<option value="${t.id}" ${FIL.tipo === t.id ? 'selected' : ''}>${t.label}</option>`).join('')}</select>
    </div>
    <div class="glass rise d3 tbl-wrap"><table class="table" style="min-width:860px">
      <thead><tr><th>Informe</th><th>Tipo</th><th>Dirigido a</th><th>Fecha</th><th style="text-align:right">Monto</th><th>Estado</th></tr></thead>
      <tbody id="tb"></tbody></table></div>`;
  if (main.querySelector('#bNuevo')) main.querySelector('#bNuevo').onclick = nuevoInforme;
  const f = () => { FIL.q = main.querySelector('#fQ').value; FIL.estado = main.querySelector('#fE').value; FIL.tipo = main.querySelector('#fT').value; pintarTabla(main); };
  main.querySelector('#fQ').oninput = f; main.querySelector('#fE').onchange = f; main.querySelector('#fT').onchange = f;
  pintarTabla(main);
}
function pintarTabla(main) {
  const tb = main.querySelector('#tb'); if (!tb) return;
  const q = FIL.q.toLowerCase();
  const lista = L.filter(x => (FIL.estado === 'all' || x.estado === FIL.estado) && (FIL.tipo === 'all' || x.tipo === FIL.tipo)
    && (!q || [x.codigo, x.titulo, x.proveedor, x.dirigido, x.pedidoTipo, x.pedidoNum, (x.docs || []).join(' '), (x.eqCods || []).join(' ')].join(' ').toLowerCase().includes(q)));
  tb.innerHTML = lista.map((x, i) => `<tr class="rowbtn slide" data-id="${x.id}" style="animation-delay:${Math.min(i * 0.04, .6).toFixed(2)}s">
    <td><div class="cod">${esc(x.codigo)}${x.version > 1 ? ` · v${x.version}` : ''}</div><div class="ttl">${esc(x.titulo)}</div>${x.proveedor ? `<div class="sub">${esc(x.proveedor)}</div>` : ''}</td>
    <td style="font-size:13.5px">${esc(tipoLbl(x.tipo))}</td><td style="font-size:13.5px">${esc(x.dirigido || '—')}</td>
    <td style="white-space:nowrap;font-size:13.5px">${fmtF(x.fecha)}</td><td class="num">${money(x.monto, x.moneda)}</td><td>${pill(x.estado)}</td></tr>`).join('')
    || `<tr><td colspan="6" class="muted" style="padding:28px 20px">${L.length ? 'No hay informes que coincidan con el filtro.' : 'Aún no hay informes registrados.'}</td></tr>`;
  tb.querySelectorAll('[data-id]').forEach(r => r.onclick = () => ficha(r.dataset.id));
}

      <div><label class="label" for="iMto">Monto (sin IGV)</label><input class="field" id="iMto" type="number" step="0.01" min="0" value="${v.monto ?? ''}" ${dis}></div></div>

const leerDatos = (m) => ({
  titulo: m.$('#iTit').value.trim(), tipo: m.$('#iTip').value, fecha: m.$('#iFec').value, dirigido: m.$('#iDir').value.trim(),
  proveedor: m.$('#iPro').value.trim(), moneda: m.$('#iMon').value, monto: m.$('#iMto').value === '' ? null : +m.$('#iMto').value, resumen: m.$('#iRes').value.trim()

// ---------------- nuevo informe ----------------
function nuevoInforme() {
  if (fracUso() >= UMBRAL_CRITICO) toast('Almacenamiento casi lleno: retire archivos antiguos antes de cargar más.', 'err');
  let archivo = null;
  const m = modal({ titulo: 'Nuevo informe', ancho: 760,
    cuerpo: `<label class="drop" id="dz" for="iFile"><div style="font-family:var(--f-display);font-weight:600;font-size:16px">Seleccionar el informe</div>
      <div class="muted" style="font-size:13.5px;margin-top:6px" id="dzTx">HTML o PDF, hasta ${fmtBytes(MAX_ARCHIVO)}. Los datos se completan solos a partir del informe.</div>
      <input type="file" id="iFile" accept=".html,.htm,.pdf" class="sr"></label>
      <div id="frm" style="margin-top:18px">${camposDatos({})}</div>
      <div class="bar" id="bar" hidden><div></div></div>`,
    pie: `<button type="button" class="btn" data-x>Cancelar</button><button type="button" class="btn" id="bBor">Guardar como borrador</button><button type="submit" class="btn btn-primary" id="bOk">Registrar como presentado</button>` });
  const elegir = async (f) => {
    archivo = f; m.$('#dzTx').textContent = `${f.name} · ${fmtBytes(f.size)}`;
    const esHTML = /\.html?$/i.test(f.name), esPDF = /\.pdf$/i.test(f.name) || f.type === 'application/pdf';
    if (esHTML || esPDF) {
      try {
        m.$('#dzTx').textContent = `${f.name} · ${fmtBytes(f.size)} · leyendo datos…`;
        let d;
        if (esHTML) d = leerHTML(await f.text());
        else { const t = await textoPDF(new Uint8Array(await f.arrayBuffer())); d = datosDeTexto(t.filas, t.titulo); }
        m.$('#dzTx').textContent = `${f.name} · ${fmtBytes(f.size)}`;
        const set = (id, v) => { if (v !== undefined && v !== null && v !== '') m.$(id).value = v; };
        set('#iTit', d.titulo); set('#iTip', d.tipo); set('#iFec', d.fecha); set('#iDir', d.dirigido); set('#iPro', d.proveedor); set('#iMon', d.moneda); set('#iMto', d.monto);
        m._docs = d.docs || [];
        toast('Datos leídos del informe. Revíselos antes de registrar.');
      } catch (e) { m.$('#dzTx').textContent = `${f.name} · ${fmtBytes(f.size)} · complete los datos manualmente`; }
    }
  };
  m.$('#iFile').onchange = (e) => e.target.files[0] && elegir(e.target.files[0]);
  const dz = m.$('#dz');
  ['dragenter', 'dragover'].forEach(t => dz.addEventListener(t, (e) => { e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => dz.addEventListener(t, (e) => { e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop', (e) => e.dataTransfer.files[0] && elegir(e.dataTransfer.files[0]));
  const guardar = async (estado) => {
    m.err('');
    const d = leerDatos(m);
    if (!archivo) return m.err('Seleccione el archivo del informe.');
    if (!d.titulo) return m.err('Ingrese el título.');
    if (!d.fecha) return m.err('Ingrese la fecha.');
    const btns = [m.$('#bOk'), m.$('#bBor')]; btns.forEach(b => b.disabled = true);
    m.$('#bar').hidden = false;
    try {
      const ref = doc(colInf());
      const c = await nuevoCodigo();
      const a = await subirArchivo(ref.id, 'v1', archivo, (p) => m.$('#bar div').style.width = Math.round(p * 100) + '%');
      a.ver = 1;
      const hist = [{ fecha: ahora(), estado: 'borrador', nota: 'Informe registrado', por: quien() }];
      if (estado === 'presentado') hist.push({ fecha: ahora(), estado: 'presentado', nota: d.dirigido ? 'Presentado a ' + d.dirigido : 'Presentado', por: quien() });
      await setDoc(ref, { ...d, codigo: c.codigo, anio: c.anio, n: c.n, estado, version: 1, archivo: a, versiones: [a], historial: hist,
        eqIds: [], eqCods: [], progId: null, progNombre: '', docs: m._docs || [], creado: serverTimestamp(), creadoPor: quien(), actualizado: serverTimestamp() });
      m.cerrar(); toast(`${c.codigo} registrado.`); ficha(ref.id);
    } catch (e) { console.error(e); m.err('No se pudo registrar: ' + (e.code || e.message)); btns.forEach(b => b.disabled = false); }
  };
  m.$('#bBor').onclick = () => guardar('borrador');
  m.form.onsubmit = (ev) => { ev.preventDefault(); guardar('presentado'); };
}

// ---------------- ficha ----------------
async function ficha(id) {
  const x = L.find(i => i.id === id) || await getDoc(doc(colInf(), id)).then(s => s.exists() ? { id: s.id, ...s.data() } : null);

  const relEd = escribe();                       // las relaciones y el pedido se pueden completar aun después de aprobado
  const disR = relEd ? '' : 'disabled';
  const ped = pedidoDe(x);
  const vers = (x.versiones || []).slice().sort((a, b) => b.ver - a.ver);
  const ap = x.aprobacion;
  const m = modal({ titulo: `<span class="cod" style="font-size:13px">${esc(x.codigo)}</span><div>${esc(x.titulo)}</div>`, ancho: 1040,

        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px">${pill(x.estado)}<span class="sub" style="margin:0">${esc(tipoLbl(x.tipo))} · versión ${x.version || 1}</span>

        <div class="sub" style="margin-bottom:10px">Vincule el informe con los equipos, el programa de trabajo y las órdenes que correspondan.</div>
        <div class="g2">
          <div style="grid-column:1/-1"><label class="label" for="rEq">Equipos</label><input class="field" id="rEq" list="dlEq" placeholder="${EQ ? 'Buscar por código o descripción y elegir' : 'Cargando equipos…'}" ${disR}><datalist id="dlEq"></datalist><div class="chips" id="cEq"></div></div>
          <div style="grid-column:1/-1"><label class="label" for="rPr">Programa de trabajo (Plan)</label><select class="field" id="rPr" ${disR}><option value="">Sin vincular</option></select></div>
          <div><label class="label" for="rPedT">Pedido Nisira</label><select class="field" id="rPedT" ${disR}><option value="">Sin pedido</option>${PEDIDOS.map(pd => `<option value="${pd.id}" ${pd.id === ped.tipo ? 'selected' : ''}>${pd.label}</option>`).join('')}</select></div>
          <div><label class="label" for="rPedN">N.º de pedido</label><input class="field" id="rPedN" value="${esc(ped.num)}" placeholder="Ej. 0004521" ${disR}></div>
          <div style="grid-column:1/-1"><label class="label" for="rDoc">Otros documentos (OC, OS, cotización)</label>
            <div style="display:flex;gap:8px"><input class="field" id="rDoc" placeholder="Ej. OS 0001-002345" ${disR}>${relEd ? '<button type="button" class="btn" id="bDoc" style="height:48px;flex-shrink:0">Agregar</button>' : ''}</div>
            <div class="chips" id="cDoc"></div></div>
        </div>
      </div>
      <div class="side">
        <div class="box"><h4>Estado</h4><div id="acc" style="display:flex;gap:8px;flex-wrap:wrap"></div>
          ${ap ? `<div style="margin-top:12px;font-size:13.5px;line-height:1.6"><b>${x.estado === 'rechazado' ? 'Rechazado' : 'Aprobado'}</b> el ${fmtF(ap.fecha)}${ap.por ? ' por ' + esc(ap.por) : ''}${ap.medio ? ' · ' + esc(ap.medio) : ''}${ap.nota ? `<div class="sub">${esc(ap.nota)}</div>` : ''}
            ${ap.montoAprobado != null ? `<div>Monto aprobado: <b>${money(ap.montoAprobado, ap.monedaAprobada)}</b></div>` : ''}
            ${ap.area || ped.tipo ? `<div class="sub">${ap.area ? 'Área: ' + esc(ap.area) : ''}${ped.tipo ? `${ap.area ? ' · ' : ''}${esc(ped.tipo)}${ped.num ? ' ' + esc(ped.num) : ' por emitir'}` : ''}</div>` : ''}
            ${ap.correo ? `<div class="sub">Correo de confirmación preparado el ${fmtF(ap.correo.preparado)}${ap.correo.para ? ' para ' + esc(ap.correo.para) : ''}</div>` : ''}
            ${x.estado === 'aprobado' ? `<button type="button" class="btn" id="bMail" style="height:36px;margin-top:8px;font-size:13px">Preparar correo de confirmación</button>` : ''}
            ${ap.evidencia ? `<button type="button" class="btn" id="bEvi" style="height:36px;margin-top:8px;font-size:13px">Ver evidencia de aprobación</button>` : ''}</div>` : ''}</div>
        <div class="box"><h4>Versiones</h4>${vers.map(v => `<div class="it"><div><b>v${v.ver}</b> <span class="sub">${fmtF(v.fecha)} · ${fmtBytes(v.bytes)}${v.retirado ? ' · retirado' : ''}</span></div>
          ${v.retirado ? '' : `<button type="button" class="btn" data-v="${v.ver}" style="height:34px;font-size:12.5px">Ver</button>`}</div>`).join('')}
          ${escribe() && !cerrado ? `<button type="button" class="btn" id="bNV" style="height:38px;margin-top:10px;width:100%">Subir nueva versión</button><input type="file" id="fNV" accept=".html,.htm,.pdf" class="sr">` : ''}
          <div class="bar" id="barNV" hidden><div></div></div></div>
        <div class="box"><h4>Historial</h4><div class="tl">${(x.historial || []).slice().reverse().map(h => `<div class="e" style="--c:${(ESTADOS_INF[h.estado] || ESTADOS_INF.borrador).fg}"><b>${esc((ESTADOS_INF[h.estado] || {}).label || h.estado)}</b> · ${fmtF(h.fecha)}<div class="sub">${esc(h.nota || '')}${h.por ? ' — ' + esc(h.por) : ''}</div></div>`).join('')}</div></div>

  if (m.$('#bEvi')) m.$('#bEvi').onclick = () => verArchivo(ap.evidencia, 'Evidencia de aprobación');
  if (m.$('#bMail')) m.$('#bMail').onclick = async () => {
    agregarDoc();
    if (abrirCorreo(estadoActual(), ap) && !ap.correo) await updateDoc(doc(colInf(), x.id), { 'aprobacion.correo': { preparado: ahora(), para: (CONTACTOS.find(c => c.id === ap.paraId) || contactoDe(ap.por) || contactoDe(x.dirigido) || {}).correo || '' } }).catch(() => {});
  };

  // relaciones
  let eqIds = [...(x.eqIds || [])], eqCods = [...(x.eqCods || [])], docs = [...(x.docs || [])];
  const pintarChips = () => {
    m.$('#cEq').innerHTML = eqCods.map((c, i) => `<span class="chip2">${esc(c)}${relEd ? `<button type="button" data-qe="${i}" aria-label="Quitar">×</button>` : ''}</span>`).join('') || '<span class="sub">Sin equipos vinculados</span>';
    m.$('#cDoc').innerHTML = docs.map((c, i) => `<span class="chip2">${esc(c)}${relEd ? `<button type="button" data-qd="${i}" aria-label="Quitar">×</button>` : ''}</span>`).join('') || '<span class="sub">Sin documentos</span>';
    m.bg.querySelectorAll('[data-qe]').forEach(b => b.onclick = () => { eqIds.splice(+b.dataset.qe, 1); eqCods.splice(+b.dataset.qe, 1); pintarChips(); });
    m.bg.querySelectorAll('[data-qd]').forEach(b => b.onclick = () => { docs.splice(+b.dataset.qd, 1); pintarChips(); });
  };
  pintarChips();
  (async () => {
    try { EQ = EQ || await listarEquipos(); m.$('#dlEq').innerHTML = EQ.map(e => `<option value="${esc(etiquetaEquipo(e))}">`).join(''); m.$('#rEq').placeholder = 'Buscar por código o descripción y pulsar Enter'; }
    catch { m.$('#rEq').placeholder = 'Sin acceso a la base de equipos'; }
    try {
      PROGS = PROGS || (await getDocs(collection(db, 'datos', 'plan', 'programas'))).docs.map(d => ({ id: d.id, ...d.data() })).filter(p => !p.migrado).sort((a, b) => String(b.desde || '').localeCompare(String(a.desde || '')));
      m.$('#rPr').innerHTML = '<option value="">Sin vincular</option>' + PROGS.map(p => `<option value="${p.id}" ${p.id === x.progId ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('');
    } catch { m.$('#rPr').innerHTML = x.progId ? `<option value="${x.progId}" selected>${esc(x.progNombre || 'Programa vinculado')}</option>` : '<option value="">Sin acceso al Plan de mantenimiento</option>'; }
  })();
  m.$('#rEq').onkeydown = (e) => {
    if (e.key !== 'Enter') return; e.preventDefault();
    const v = e.target.value.trim(); if (!v || !EQ) return;
    const eq = EQ.find(q => etiquetaEquipo(q) === v) || EQ.find(q => String(q.codigo).toLowerCase() === v.toLowerCase());
    if (!eq) { toast('Equipo no encontrado en la base.', 'err'); return; }
    if (!eqIds.includes(eq.id)) { eqIds.push(eq.id); eqCods.push(eq.codigo); }
    e.target.value = ''; pintarChips();
  };
  m.$('#rEq').onchange = (e) => { if (EQ && EQ.find(q => etiquetaEquipo(q) === e.target.value)) m.$('#rEq').onkeydown({ key: 'Enter', preventDefault() {}, target: e.target }); };
  const agregarDoc = () => { const i = m.$('#rDoc'); const v = i.value.trim(); if (v && !docs.includes(v)) docs.push(v); i.value = ''; pintarChips(); };
  m.$('#rDoc').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); agregarDoc(); } };
  m.$('#rDoc').onblur = agregarDoc;
  if (m.$('#bDoc')) m.$('#bDoc').onclick = agregarDoc;
  const estadoActual = () => ({ ...x, docs, pedidoTipo: m.$('#rPedT').value, pedidoNum: m.$('#rPedN').value.trim() });

  // acciones de estado
  const acc = [];
  if (escribe() && x.estado === 'borrador') acc.push(['presentar', 'Marcar como presentado']);
  if (gestor() && ['presentado', 'observado'].includes(x.estado)) acc.push(['aprobar', 'Registrar aprobación'], ['observar', 'Registrar observación'], ['rechazar', 'Registrar rechazo']);
  if (escribe() && x.estado === 'observado') acc.push(['presentar', 'Volver a presentar']);
  m.$('#acc').innerHTML = acc.map(([k, l]) => `<button type="button" class="btn ${k === 'aprobar' ? 'btn-primary' : ''}" data-a="${k}" style="height:38px;font-size:13px">${l}</button>`).join('') || '<span class="sub">Sin acciones disponibles.</span>';
  m.bg.querySelectorAll('[data-a]').forEach(b => b.onclick = () => cambiarEstado(x, b.dataset.a, m));

  // nueva versión
  if (m.$('#bNV')) {
    m.$('#bNV').onclick = () => m.$('#fNV').click();
    m.$('#fNV').onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      const ver = (x.version || 1) + 1;
      m.$('#barNV').hidden = false;
      try {
        const a = await subirArchivo(x.id, 'v' + ver, f, (p) => m.$('#barNV div').style.width = Math.round(p * 100) + '%');
        a.ver = ver;
        await updateDoc(doc(colInf(), x.id), { version: ver, archivo: a, versiones: arrayUnion(a),
          historial: arrayUnion({ fecha: ahora(), estado: x.estado, nota: `Nueva versión v${ver}`, por: quien() }), actualizado: serverTimestamp() });
        toast(`Versión v${ver} cargada.`); m.cerrar(); setTimeout(() => ficha(x.id), 300);
      } catch (er) { toast('No se pudo cargar: ' + (er.code || er.message), 'err'); m.$('#barNV').hidden = true; }
    };
  }

  if (!relEd) return;
  m.form.onsubmit = async (ev) => {
    ev.preventDefault(); m.err('');
    agregarDoc();
    const d = editable ? leerDatos(m) : {};
    if (editable && !d.titulo) return m.err('Ingrese el título.');
    d.pedidoTipo = m.$('#rPedT').value; d.pedidoNum = m.$('#rPedN').value.trim();
    if (d.pedidoNum && !d.pedidoTipo) return m.err('Indique si el pedido es PSR (servicio) o PED (materiales).');
    const progId = m.$('#rPr').value || null;
    const progNombre = progId ? (PROGS?.find(p => p.id === progId)?.nombre || x.progNombre || '') : '';
    const b = m.$('#bG'); b.disabled = true; b.textContent = 'Guardando…';
    try {
      await updateDoc(doc(colInf(), x.id), { ...d, eqIds, eqCods, docs, progId, progNombre, actualizado: serverTimestamp() });
      toast('Cambios guardados.'); m.cerrar();
    } catch (er) { m.err('No se pudo guardar: ' + (er.code || er.message)); b.disabled = false; b.textContent = 'Guardar cambios'; }
  };
}

// ---------------- destinatarios y correo de confirmación ----------------
const etiquetaContacto = (c) => c.cargo ? `${c.nombre} — ${c.cargo}` : c.nombre;
const nrm = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
function contactoDe(texto) {
  const t = nrm(texto); if (!t) return null;
  return CONTACTOS.find(c => nrm(etiquetaContacto(c)) === t) || CONTACTOS.find(c => t.startsWith(nrm(c.nombre))) || null;
}
// Pedido Nisira del informe: campos propios, el registrado en la aprobación o el escrito como documento ("PSR 0004521")
function pedidoDe(x, ap = x.aprobacion || {}) {
  let tipo = x.pedidoTipo || ap.pedidoTipo || '', num = x.pedidoNum || ap.pedidoNum || '';
  if (!num) for (const d of (x.docs || [])) {
    const m = String(d).match(/^\s*(PSR|PED)\b[\s.:#N°º-]*([\w-]+)/i);
    if (m) { tipo = tipo || m[1].toUpperCase(); num = m[2]; break; }
  }
  return { tipo, num };
}
const otrosDocs = (x, ped) => (x.docs || []).filter(d => !(ped.num && String(d).toUpperCase().includes(String(ped.num).toUpperCase()) && /PSR|PED/i.test(d)));
const fmtFechaCorta = (iso) => iso ? iso.slice(0, 10).split('-').reverse().join('/') : '';
function textoCorreo(x, ap, para) {
  const lin = [];
  lin.push(`Estimado(a) ${para ? para.nombre : (ap.por || '')}:`, '');
  lin.push('Se registra la aprobación del siguiente requerimiento:', '');
  lin.push(`Informe: ${x.codigo} — ${x.titulo}`);
  lin.push(`Fecha de aprobación: ${fmtFechaCorta(ap.fecha)}${ap.medio ? ' (' + ap.medio.toLowerCase() + ')' : ''}`);
  if (ap.area) lin.push(`Área: ${ap.area}`);
  const ped = pedidoDe(x, ap);
  if (ped.tipo || ped.num) lin.push(`Pedido: ${ped.tipo || 'Pedido'}${ped.num ? ' N.º ' + ped.num : ' (por emitir)'}${ped.tipo ? ' — ' + (ped.tipo === 'PSR' ? 'servicio' : 'materiales') : ''}`);
  if (x.proveedor) lin.push(`Proveedor: ${x.proveedor}`);
  const otros = otrosDocs(x, ped); if (otros.length) lin.push(`Documentos: ${otros.join(', ')}`);
  if (ap.montoAprobado != null) lin.push(`Monto aprobado: ${money(ap.montoAprobado, ap.monedaAprobada)} sin IGV`);
  if (ap.detalle) lin.push('', 'Detalle:', ap.detalle);
  if (ap.nota) lin.push('', 'Observaciones:', ap.nota);
  lin.push('', 'Se solicita confirmar por este medio la conformidad con lo indicado.', '', 'Atentamente,', quien(), 'Departamento de Mantenimiento');
  return lin.join('\n');
}
function abrirCorreo(x, ap) {
  const para = CONTACTOS.find(c => c.id === ap.paraId) || contactoDe(ap.por) || contactoDe(x.dirigido);
  const cc = CONTACTOS.filter(c => (ap.ccIds || []).includes(c.id) && c.correo).map(c => c.correo);
  if (!para?.correo) { toast('El destinatario no tiene correo registrado. Agréguelo en Destinatarios.', 'err'); return false; }
  const asunto = `Aprobación registrada — ${x.codigo} · ${x.titulo}`;
  const url = `mailto:${encodeURIComponent(para.correo)}?${cc.length ? 'cc=' + encodeURIComponent(cc.join(',')) + '&' : ''}subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(textoCorreo(x, ap, para))}`;
  const a = document.createElement('a'); a.href = url; document.body.appendChild(a); a.click(); a.remove();
  return true;
}

function cambiarEstado(x, accion, mFicha) {
  const T = { presentar: ['Presentar informe', 'presentado'], aprobar: ['Registrar aprobación', 'aprobado'], observar: ['Registrar observación', 'observado'], rechazar: ['Registrar rechazo', 'rechazado'] }[accion];
  const conAprob = accion === 'aprobar' || accion === 'rechazar';
  let evid = null;
  const m = modal({ titulo: T[0], ancho: accion === 'aprobar' ? 720 : 560,
    cuerpo: `<div class="g2">
      <div><label class="label" for="eFec">Fecha</label><input class="field" id="eFec" type="date" value="${hoyISO()}"></div>
      ${conAprob ? `<div><label class="label" for="eMed">Medio</label><select class="field" id="eMed"><option>Correo</option><option>Acta / documento firmado</option><option>Reunión</option><option>Verbal</option></select></div>
        <div style="grid-column:1/-1"><label class="label" for="ePor">${accion === 'aprobar' ? 'Aprobado por' : 'Rechazado por'}</label><input class="field" id="ePor" value="${esc(x.dirigido || '')}"></div>` : ''}
      ${accion === 'aprobar' ? `
        <div style="display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px"><div><label class="label" for="eMon">Moneda</label><select class="field" id="eMon">${['S/', 'US$'].map(mo => `<option ${mo === (x.moneda || 'S/') ? 'selected' : ''}>${mo}</option>`).join('')}</select></div>
          <div><label class="label" for="eMto">Monto aprobado (sin IGV)</label><input class="field" id="eMto" type="number" step="0.01" min="0" value="${x.monto ?? ''}"></div></div>
        <div><label class="label" for="eArea">Área</label><select class="field" id="eArea"><option value="">Seleccione</option>${AREAS_INF.map(a => `<option ${a === (x.area || '') ? 'selected' : ''}>${a}</option>`).join('')}</select></div>
        <div><label class="label" for="ePed">Pedido Nisira</label><select class="field" id="ePed"><option value="">Sin pedido aún</option>${PEDIDOS.map(pd => `<option value="${pd.id}" ${pd.id === pedidoDe(x).tipo ? 'selected' : ''}>${pd.label}</option>`).join('')}</select></div>
        <div><label class="label" for="ePedN">N.º de pedido</label><input class="field" id="ePedN" value="${esc(pedidoDe(x).num)}" placeholder="Si ya fue emitido"></div>
        <div style="grid-column:1/-1"><label class="label" for="eDet">Resumen de lo aprobado</label><textarea class="field" id="eDet" rows="3" style="height:auto;padding:12px 16px;line-height:1.5">${esc(x.resumen || x.titulo || '')}</textarea></div>` : ''}
      <div style="grid-column:1/-1"><label class="label" for="eNot">${accion === 'observar' ? 'Observaciones recibidas' : 'Nota (opcional)'}</label><textarea class="field" id="eNot" rows="3" style="height:auto;padding:12px 16px;line-height:1.5"></textarea></div>
      ${accion === 'aprobar' ? `<div style="grid-column:1/-1" class="box">
        <label class="check"><input type="checkbox" id="eMail" checked>Preparar correo de confirmación al confirmar</label>
        <div class="g2" style="margin-top:10px"><div><label class="label" for="ePara">Para</label><select class="field" id="ePara"><option value="">— Elija destinatario —</option>${CONTACTOS.map(c => `<option value="${c.id}" ${c.correo ? '' : 'disabled'}>${esc(etiquetaContacto(c))}${c.correo ? '' : ' (sin correo)'}</option>`).join('')}</select></div>
          <div><span class="label">Con copia</span><div style="display:flex;flex-direction:column;gap:6px;max-height:110px;overflow:auto">${CONTACTOS.filter(c => c.correo).map(c => `<label class="check" style="font-size:13px"><input type="checkbox" class="eCC" value="${c.id}" ${c.copia ? 'checked' : ''}>${esc(c.nombre)}</label>`).join('') || '<span class="sub">Sin destinatarios con correo</span>'}</div></div></div>
        <div class="sub" style="margin-top:8px">Se abre su correo con el mensaje listo para enviar. Adjunte después la respuesta de conformidad como evidencia. <a href="#destinatarios">Gestionar destinatarios</a></div></div>` : ''}
      ${conAprob ? `<div style="grid-column:1/-1"><label class="label" for="eEv">Evidencia (correo o acta en PDF/imagen, opcional)</label><input class="field" id="eEv" type="file" accept=".pdf,image/*,.html" style="padding-top:11px"></div>` : ''}
    </div><div class="bar" id="bar" hidden><div></div></div>`,
    pie: `<button type="button" class="btn" data-x>Cancelar</button><button type="submit" class="btn btn-primary" id="eOk">Confirmar</button>` });
  if (m.$('#eEv')) m.$('#eEv').onchange = (e) => { evid = e.target.files[0] || null; };
  if (m.$('#ePara')) {
    const c0 = contactoDe(x.dirigido); if (c0 && c0.correo) m.$('#ePara').value = c0.id;
    m.$('#ePara').onchange = () => { const c = CONTACTOS.find(k => k.id === m.$('#ePara').value); if (c) m.$('#ePor').value = etiquetaContacto(c); };
    m.bg.querySelectorAll('a[href="#destinatarios"]').forEach(a => a.onclick = () => { m.cerrar(); mFicha.cerrar(); });
  }
  m.form.onsubmit = async (ev) => {
    ev.preventDefault(); m.err('');
    const fecha = m.$('#eFec').value || hoyISO(), nota = m.$('#eNot').value.trim();
    if (accion === 'observar' && !nota) return m.err('Registre las observaciones recibidas.');
    const b = m.$('#eOk'); b.disabled = true;
    try {
      const upd = { estado: T[1], actualizado: serverTimestamp() };
      if (conAprob) {
        const ap = { fecha, por: m.$('#ePor').value.trim(), medio: m.$('#eMed').value, nota };
        if (accion === 'aprobar') {
          ap.monedaAprobada = m.$('#eMon').value;
          ap.montoAprobado = m.$('#eMto').value === '' ? null : +m.$('#eMto').value;
          ap.area = m.$('#eArea').value; ap.pedidoTipo = m.$('#ePed').value; ap.pedidoNum = m.$('#ePedN').value.trim();
          ap.detalle = m.$('#eDet').value.trim();
          ap.paraId = m.$('#ePara').value || null;
          ap.ccIds = [...m.bg.querySelectorAll('.eCC:checked')].map(i => i.value);
          if (m.$('#eMail').checked && !ap.paraId) { b.disabled = false; return m.err('Elija el destinatario del correo o desmarque "Preparar correo".'); }
          if (m.$('#eMail').checked) ap.correo = { preparado: ahora(), para: (CONTACTOS.find(c => c.id === ap.paraId) || {}).correo || '' };
        }
        if (evid) { m.$('#bar').hidden = false; ap.evidencia = await subirArchivo(x.id, 'aprobacion', evid, (p) => m.$('#bar div').style.width = Math.round(p * 100) + '%'); }
        upd.aprobacion = ap;
      }
      const notaH = accion === 'presentar' ? (x.dirigido ? 'Presentado a ' + x.dirigido : 'Presentado') : (nota || (conAprob ? `${m.$('#eMed').value}${m.$('#ePor').value ? ' · ' + m.$('#ePor').value : ''}` : ''));
      upd.historial = arrayUnion({ fecha: fecha + 'T12:00:00', estado: T[1], nota: notaH, por: quien() });
      if (upd.aprobacion?.area) upd.area = upd.aprobacion.area;
      if (upd.aprobacion?.pedidoTipo || upd.aprobacion?.pedidoNum) { upd.pedidoTipo = upd.aprobacion.pedidoTipo; upd.pedidoNum = upd.aprobacion.pedidoNum; }
      await updateDoc(doc(colInf(), x.id), upd);
      if (upd.aprobacion?.correo) abrirCorreo({ ...x, pedidoTipo: upd.pedidoTipo ?? x.pedidoTipo, pedidoNum: upd.pedidoNum ?? x.pedidoNum }, upd.aprobacion);
      m.cerrar(); mFicha.cerrar(); toast(`${x.codigo}: ${ESTADOS_INF[T[1]].label.toLowerCase()}.`); setTimeout(() => ficha(x.id), 300);
    } catch (er) { m.err('No se pudo registrar: ' + (er.code || er.message)); b.disabled = false; }
  };
}

// ---------------- vista Destinatarios ----------------
function vistaDestinatarios(main) {
  const ed = gestor();
  main.innerHTML = `
    <div class="pagehead"><div><div class="eyebrow rise">Informes técnicos</div><h1 class="h-display rise d1">Destinatarios</h1></div>
      ${ed ? '<button class="btn btn-primary rise d2" id="bNC"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nuevo destinatario</button>' : ''}</div>
    <p class="muted rise d2" style="margin:-6px 0 18px;line-height:1.6;max-width:760px">Personas a quienes se dirigen los informes. Su correo se usa para preparar la confirmación de aprobación. Los marcados con "Copia" se incluyen en copia por defecto (por ejemplo, Logística).</p>
    <div class="glass rise d3 tbl-wrap"><table class="table" style="min-width:720px">
      <thead><tr><th>Nombre</th><th>Cargo</th><th>Correo</th><th>Área</th><th>Copia</th><th></th></tr></thead>
      <tbody>${CONTACTOS.map(c => `<tr><td style="font-weight:500">${esc(c.nombre)}</td><td style="font-size:13.5px">${esc(c.cargo || '')}</td><td class="mono" style="font-size:12.5px">${esc(c.correo || '—')}</td>
        <td style="font-size:13.5px">${esc(c.area || '')}</td><td>${c.copia ? '<span class="pill" style="background:rgba(111,227,207,.16);color:#8FF0DE">Copia</span>' : ''}</td>
        <td style="text-align:right">${ed ? `<button class="btn" data-ec="${c.id}" style="height:36px;font-size:12.5px">Editar</button>` : ''}</td></tr>`).join('')
        || '<tr><td colspan="6" class="muted" style="padding:28px 20px">Aún no hay destinatarios registrados.</td></tr>'}</tbody></table></div>`;
  if (main.querySelector('#bNC')) main.querySelector('#bNC').onclick = () => editarContacto(null);
  main.querySelectorAll('[data-ec]').forEach(b => b.onclick = () => editarContacto(CONTACTOS.find(c => c.id === b.dataset.ec)));
}
function editarContacto(c) {
  const nuevo = !c; const v = c || { nombre: '', cargo: '', correo: '', area: '', copia: false };
  const m = modal({ titulo: nuevo ? 'Nuevo destinatario' : 'Editar destinatario', ancho: 620,
    cuerpo: `<div class="g2">
      <div><label class="label" for="cNom">Nombre</label><input class="field" id="cNom" value="${esc(v.nombre)}"></div>
      <div><label class="label" for="cCar">Cargo</label><input class="field" id="cCar" value="${esc(v.cargo)}" placeholder="Jefe de Operaciones"></div>
      <div><label class="label" for="cMail">Correo</label><input class="field" id="cMail" type="email" value="${esc(v.correo)}"></div>
      <div><label class="label" for="cArea">Área</label><input class="field" id="cArea" value="${esc(v.area)}" placeholder="Operaciones"></div>
      <div style="grid-column:1/-1"><label class="check"><input type="checkbox" id="cCopia" ${v.copia ? 'checked' : ''}>Incluir en copia por defecto en las confirmaciones de aprobación</label></div></div>`,
    pie: `${nuevo ? '' : '<button type="button" class="btn btn-danger" id="cDel" style="margin-right:auto">Eliminar</button>'}<button type="button" class="btn" data-x>Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button>` });
  const guardar = async (lista) => { await setDoc(docContactos(), { lista, actualizado: serverTimestamp() }); };
  if (m.$('#cDel')) m.$('#cDel').onclick = async () => { await guardar(CONTACTOS.filter(k => k.id !== c.id)); m.cerrar(); toast('Destinatario eliminado.'); };
  m.form.onsubmit = async (ev) => {
    ev.preventDefault(); m.err('');
    const d = { id: v.id || ('c' + Date.now().toString(36)), nombre: m.$('#cNom').value.trim(), cargo: m.$('#cCar').value.trim(), correo: m.$('#cMail').value.trim().toLowerCase(), area: m.$('#cArea').value.trim(), copia: m.$('#cCopia').checked };
    if (!d.nombre) return m.err('Ingrese el nombre.');
    if (d.correo && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.correo)) return m.err('El correo no es válido.');
    try { await guardar(nuevo ? CONTACTOS.concat([d]) : CONTACTOS.map(k => k.id === d.id ? d : k)); m.cerrar(); toast('Destinatario guardado.'); }
    catch (e) { m.err('No se pudo guardar: ' + (e.code || e.message)); }
  };
}

// ---------------- vista Almacenamiento ----------------
function archivosDe(lista) {
  const out = [];
  lista.forEach(x => {
    (x.versiones || []).forEach(v => out.push({ inf: x, a: v, tipo: `Versión v${v.ver}`, clave: 'v' + v.ver }));
    if (x.aprobacion?.evidencia) out.push({ inf: x, a: x.aprobacion.evidencia, tipo: 'Evidencia de aprobación', clave: 'aprobacion' });
  });
  return out.sort((p, q) => String(p.a.fecha).localeCompare(String(q.a.fecha)));
}
function vistaAlmacen(main) {
  const f = fracUso(), pct = Math.min(f * 100, 100);
  const col = f >= UMBRAL_CRITICO ? '#FF8F8F' : f >= UMBRAL_AVISO ? '#F5B94A' : '#6FE3CF';
  const files = archivosDe(L);
  const activos = files.filter(z => !z.a.retirado);
  main.innerHTML = `
    <div class="pagehead"><div><div class="eyebrow rise">Informes técnicos</div><h1 class="h-display rise d1">Almacenamiento</h1></div>
      ${gestor() ? '<button class="btn rise d2" id="bRec">Recalcular uso</button>' : ''}</div>
    <div class="glass rise d2" style="padding:24px 26px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">
        <div style="font-family:var(--f-display);font-size:30px;font-weight:600;color:${col}">${pct.toFixed(pct < 1 ? 2 : 1)} %</div>
        <div class="muted">${fmtBytes(USO.bytes)} usados de ${fmtBytes(LIMITE_STORAGE)} reservados · ${activos.length} archivos</div></div>
      <div class="meter"><div style="width:${Math.max(pct, .4)}%;background:${col}"></div></div>
      <div class="sub" style="line-height:1.6">Aviso al ${UMBRAL_AVISO * 100} % y alerta crítica al ${UMBRAL_CRITICO * 100} %. Los archivos se guardan en la base de datos del SIM (sin costo), que comparten todos los aplicativos; por eso se reserva un espacio fijo para informes. Para liberar espacio, descargue los archivos más antiguos y retírelos: la ficha del informe se conserva con su historial.</div>
    </div>
    ${avisoUso()}
    <div class="glass rise d3 tbl-wrap" style="margin-top:18px"><table class="table" style="min-width:820px">
      <thead><tr><th>Archivo (más antiguos primero)</th><th>Informe</th><th>Fecha</th><th style="text-align:right">Tamaño</th><th></th></tr></thead>
      <tbody>${files.map((z, i) => `<tr style="${z.a.retirado ? 'opacity:.5' : ''}"><td><div style="font-size:13.5px">${esc(z.a.nombre)}</div><div class="sub">${esc(z.tipo)}${z.a.retirado ? ' · retirado el ' + fmtF(z.a.retirado) : ''}</div></td>
        <td><div class="cod">${esc(z.inf.codigo)}</div><div class="sub">${esc(z.inf.titulo)}</div></td><td style="font-size:13.5px;white-space:nowrap">${fmtF(z.a.fecha)}</td><td class="num">${fmtBytes(z.a.bytes)}</td>
        <td style="text-align:right;white-space:nowrap">${!z.a.retirado && gestor() ? `<button class="btn" data-dl="${i}" style="height:36px;font-size:12.5px">Descargar</button> <button class="btn btn-danger" data-rt="${i}" style="height:36px;font-size:12.5px">Retirar</button>` : ''}</td></tr>`).join('')
        || '<tr><td colspan="5" class="muted" style="padding:28px 20px">Aún no hay archivos cargados.</td></tr>'}</tbody></table></div>`;
  main.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => descargar(files[+b.dataset.dl]));
  main.querySelectorAll('[data-rt]').forEach(b => b.onclick = () => retirar(files[+b.dataset.rt]));
  if (main.querySelector('#bRec')) main.querySelector('#bRec').onclick = async () => {
    const bytes = archivosDe(L).filter(z => !z.a.retirado).reduce((s, z) => s + (+z.a.bytes || 0), 0);
    await setDoc(docUso(), { bytes, archivos: archivosDe(L).filter(z => !z.a.retirado).length, actualizado: serverTimestamp() });
    toast('Uso recalculado.');
  };
}
async function descargar(z) {
  try {
    toast('Preparando descarga…');
    const blob = await leerArchivo('inf', z.a);
    descargarBlob(blob, nombreSeguro(z.inf.codigo.replace(/\//g, '-') + '_' + z.a.nombre));
  } catch (e) { toast('No se pudo descargar: ' + (e.code || e.message), 'err'); }
}
function retirar(z) {
  const m = modal({ titulo: 'Retirar archivo del SIM', ancho: 540,
    cuerpo: `<p class="muted" style="margin:0;line-height:1.6">Se eliminará <b>${esc(z.a.nombre)}</b> (${fmtBytes(z.a.bytes)}) del almacenamiento. La ficha de <b>${esc(z.inf.codigo)}</b> y su historial se conservan, pero el archivo ya no podrá abrirse desde el SIM.</p>
      <label class="check" style="margin-top:16px"><input type="checkbox" id="rOk">Ya descargué y guardé una copia de este archivo</label>`,
    pie: `<button type="button" class="btn" data-x>Cancelar</button><button type="submit" class="btn btn-danger" id="rBtn">Retirar archivo</button>` });
  m.form.onsubmit = async (ev) => {
    ev.preventDefault();
    if (!m.$('#rOk').checked) return m.err('Confirme que guardó una copia del archivo.');
    m.$('#rBtn').disabled = true;
    try {
      await borrarArchivo('inf', z.a);
      const fecha = ahora();
      const r = doc(colInf(), z.inf.id);
      const s = await getDoc(r); const d = s.data();
      const upd = { actualizado: serverTimestamp(), historial: arrayUnion({ fecha, estado: d.estado, nota: `Archivo retirado del SIM: ${z.a.nombre}`, por: quien() }) };
      if (z.clave === 'aprobacion') upd['aprobacion.evidencia.retirado'] = fecha;
      else {
        upd.versiones = (d.versiones || []).map(v => v.fid === z.a.fid ? { ...v, retirado: fecha } : v);
        if (d.archivo?.fid === z.a.fid) upd['archivo.retirado'] = fecha;
      }
      await updateDoc(r, upd);
      await setDoc(docUso(), { bytes: increment(-(+z.a.bytes || 0)), archivos: increment(-1), actualizado: serverTimestamp() }, { merge: true });
      m.cerrar(); toast('Archivo retirado. Espacio liberado: ' + fmtBytes(z.a.bytes));
    } catch (e) { m.err('No se pudo retirar: ' + (e.code || e.message)); m.$('#rBtn').disabled = false; }
  };
}

// ---------------- arranque ----------------
function render(mod) {
  if (!CTX?.main) return;
  if (mod === 'almacenamiento') vistaAlmacen(CTX.main); else if (mod === 'destinatarios') vistaDestinatarios(CTX.main); else vistaInformes(CTX.main);
}
CTX = await iniciarApp({ appId: 'inf', alCambiarModulo: (mod, ctx) => { CTX = ctx; render(mod); } });
let primera = true;
onSnapshot(colInf(), (s) => {
  L = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(b.codigo || '').localeCompare(String(a.codigo || ''), 'es', { numeric: true }));
  if (!document.querySelector('.modal-bg')) render(CTX.modulo);
  if (primera) { primera = false; const id = new URLSearchParams(location.search).get('i'); if (id) ficha(id); }
}, (e) => toast('No se pudieron leer los informes: ' + (e.code || e.message), 'err'));
onSnapshot(docContactos(), (s) => { CONTACTOS = (s.exists() ? s.data().lista || [] : []).slice().sort((a, b) => a.nombre.localeCompare(b.nombre, 'es')); if (!document.querySelector('.modal-bg')) render(CTX.modulo); }, () => {});
onSnapshot(docUso(), (s) => { USO = s.exists() ? s.data() : { bytes: 0 }; if (!document.querySelector('.modal-bg')) render(CTX.modulo); }, () => {});
</script>
